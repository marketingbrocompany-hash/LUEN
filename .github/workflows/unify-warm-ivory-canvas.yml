name: Unify Warm Ivory canvas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-warm-ivory-canvas.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Warm Ivory canvas fix
        run: python tools/unify_warm_ivory_canvas.py
      - name: Validate final canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/css/site-overrides.css').read_text()
          html=Path('index.html').read_text()
          marker='/* FINAL WARM IVORY CANVAS · 2026-08-23 */'
          assert marker in css
          tail=css[css.index(marker):]
          assert 'background:#F5F3EE!important' in tail
          assert 'background-image:none!important' in tail
          assert 'assets/css/site-overrides.css?v=20260823-7' in html
          assert 'https://formspree.io/f/xaewddev' in html
          assert html.count('data-loop-strip') >= 5
          print('Warm Ivory canvas validation passed')
          PY
          node --check assets/js/site.js
          node --check assets/js/site-core.js
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/unify_warm_ivory_canvas.py .github/workflows/unify-warm-ivory-canvas.yml
          git add assets/css/site-overrides.css index.html
          git commit -m 'Enforce one Warm Ivory section canvas'
          git push origin HEAD:main
