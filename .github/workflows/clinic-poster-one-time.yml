name: LUEN one-time clinic poster source sync
on:
  push:
    branches:
      - fix/clinic-static-poster-20261022

permissions:
  contents: write

jobs:
  create-first-frame-poster:
    if: ${{ !contains(github.event.head_commit.message, '[poster-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/clinic-static-poster-20261022
          persist-credentials: true

      - name: Generate the exact 00-second frame from the already approved clip
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/video/luen-motion/clinic-preview.mp4
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -ss 0 -i assets/video/luen-motion/clinic-preview.mp4 \
            -frames:v 1 -c:v libwebp -quality 88 \
            assets/images/luen-motion/clinic-poster.webp
          actual="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 assets/images/luen-motion/clinic-poster.webp)"
          test "$actual" = "406x720"
          test "$(stat -c%s assets/images/luen-motion/clinic-poster.webp)" -gt 8000
          echo "Clinic poster frame: $actual"
          sha256sum assets/images/luen-motion/clinic-poster.webp

      - name: Commit only the derived poster on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/images/luen-motion/clinic-poster.webp; then
            echo "Static clinic poster was already identical; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/images/luen-motion/clinic-poster.webp
          git commit -m "fix: source-control the clinic 00-second poster [poster-generated]"
          git push origin HEAD:refs/heads/fix/clinic-static-poster-20261022
