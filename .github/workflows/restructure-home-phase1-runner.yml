name: Restructure homepage phase 1 runner

on:
  push:
    branches:
      - restructure-home-phase1

permissions:
  contents: write

jobs:
  restructure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restructure-home-phase1
          fetch-depth: 0
      - name: Reorder homepage safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          markers=['<!-- PROOF / CAPABILITY SNAPSHOT -->','<!-- WORK -->','<!-- SELECTED CLIENTS -->','<!-- IDENTITY -->','<!-- CASE STUDIES -->','<!-- SERVICES -->']
          if any(s.count(x)!=1 for x in markers): raise SystemExit('major section marker count mismatch')
          pos=[s.index(x) for x in markers]
          if pos!=sorted(pos): raise SystemExit('unexpected original section order')
          a,b,c,d,e,f=pos
          prefix=s[:a]; capability=s[a:b]; work=s[b:c]; brand=s[c:d]; middle=s[d:e]; cases=s[e:f]; suffix=s[f:]
          capability=capability.replace('<!-- PROOF / CAPABILITY SNAPSHOT -->','<!-- CAPABILITY SNAPSHOT -->',1)
          outcomes='''<!-- BUSINESS OUTCOMES -->
<section aria-label="LUEN 비즈니스 성과 사례" class="proof-strip outcome-strip">
<div class="container proof-grid">
<article class="proof-item sr"><span class="proof-kicker">PURCHASE</span><strong>라쿠텐 판매 랭킹 1위</strong><p>실사용 중심의 리뷰 콘텐츠로 제품의 기능과 구매 이유를 자연스럽게 전달한 사례</p></article>
<article class="proof-item sr d1"><span class="proof-kicker">RESERVATION</span><strong>실제 예약 300~1,000건+</strong><p>일본 소비자의 시술 전 불안과 궁금증을 해소해 예약으로 이어진 캠페인 사례</p></article>
<article class="proof-item sr d2"><span class="proof-kicker">STORE VISIT</span><strong>팬들의 매장 성지순례</strong><p>유튜버 매장 POP까지 제작해 콘텐츠 경험을 오프라인 방문과 인증으로 확장한 사례</p></article>
<article class="proof-item sr d3"><span class="proof-kicker">MARKET INTEREST</span><strong>인지도·구매 관심 확대</strong><p>한국 식품의 매력을 강한 체험 콘텐츠로 전달해 일본 시장의 관심을 넓힌 사례</p></article>
</div>
</section>
'''
          old='''<div class="hero-cta">\n<a class="btn btn-primary" href="#work">Selected Work 보기 <span>↓</span></a>\n<a class="btn btn-secondary" href="#platforms">서비스 구조 보기</a>\n</div>'''
          new='''<div class="hero-cta">\n<a class="btn btn-primary" href="#contact">캠페인 상담하기 <span>→</span></a>\n<a class="btn btn-secondary" href="#cases">대표 캠페인 사례 보기 <span>↓</span></a>\n</div>'''
          if prefix.count(old)!=1: raise SystemExit('static hero CTA mismatch')
          prefix=prefix.replace(old,new,1)
          if suffix.count('assets/js/site.js?v=20260823-1')!=1: raise SystemExit('site.js version mismatch')
          suffix=suffix.replace('assets/js/site.js?v=20260823-1','assets/js/site.js?v=20260823-2',1)
          out=prefix+outcomes+brand+cases+capability+work+middle+suffix
          expected={'<!-- BUSINESS OUTCOMES -->':1,'<!-- SELECTED CLIENTS -->':1,'<!-- CASE STUDIES -->':1,'<!-- CAPABILITY SNAPSHOT -->':1,'<!-- WORK -->':1,'id="cases"':1,'id="work"':1,'class="brand-wall"':1,'class="case-studies"':1,'class="proof-strip outcome-strip"':1}
          for needle,n in expected.items():
              if out.count(needle)!=n: raise SystemExit(f'count mismatch {needle}: {out.count(needle)}')
          order=['<!-- BUSINESS OUTCOMES -->','<!-- SELECTED CLIENTS -->','<!-- CASE STUDIES -->','<!-- CAPABILITY SNAPSHOT -->','<!-- WORK -->','<!-- IDENTITY -->','<!-- PERFORMANCE -->','<!-- SERVICES -->']
          op=[out.index(x) for x in order]
          if op!=sorted(op): raise SystemExit('final section order mismatch')
          p.write_text(out,encoding='utf-8')
          js=Path('assets/js/site.js'); j=js.read_text(encoding='utf-8')
          oldj="heroCtas[1].setAttribute('href','#work');"; newj="heroCtas[1].setAttribute('href','#cases');"
          if j.count(oldj)!=1: raise SystemExit('runtime CTA mismatch')
          js.write_text(j.replace(oldj,newj,1),encoding='utf-8')
          PY
      - name: Validate result
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',text)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit(f'duplicate IDs: {dup}')
          required=['top','work','cases','about','platforms','youtube','performance','services','process','contact']
          missing=[x for x in required if x not in ids]
          if missing: raise SystemExit(f'missing anchors: {missing}')
          class P(HTMLParser): pass
          P().feed(text)
          js=Path('assets/js/site.js').read_text(encoding='utf-8')
          if "heroCtas[1].setAttribute('href','#cases');" not in js: raise SystemExit('runtime hero CTA not updated')
          if 'assets/js/site.js?v=20260823-2' not in text: raise SystemExit('cache version not updated')
          print('phase 1 validation passed')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/site.js
          git diff --cached --quiet && exit 0
          git commit -m "Reorder homepage around business outcomes"
          git push origin HEAD:restructure-home-phase1
