name: Consolidate homepage CSS layers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-css.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one authoritative override stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/css')
          index = Path('index.html')

          source_paths = [
              css / 'platform-network-base.css',
              css / 'initial-theme.css',
              css / 'site-current.css',
              css / 'content-desktop.css',
              css / 'content-video-base.css',
              css / 'visual-simplify.css',
          ]
          for path in source_paths:
              assert path.exists(), f'missing source: {path}'

          platform = (css / 'platform-network-base.css').read_text()
          initial = (css / 'initial-theme.css').read_text()
          current = (css / 'site-current.css').read_text()
          desktop = (css / 'content-desktop.css').read_text()
          video = (css / 'content-video-base.css').read_text()
          simplify = (css / 'visual-simplify.css').read_text()

          video, removed = re.subn(
              r'^\s*@import\s+url\(["\']content-desktop\.css\?v=20260820-1["\']\);\s*',
              '', video, count=1
          )
          assert removed == 1, 'expected content-desktop import not found exactly once'

          sections = [
              ('PLATFORM NETWORK BASE', platform),
              ('FIRST PAINT / WARM IVORY THEME', initial),
              ('CURRENT SITE OVERRIDES', current),
              ('CONTENT DESKTOP RULES', desktop),
              ('CONTENT / VIDEO BASE', video),
              ('VISUAL SIMPLIFICATION', simplify),
          ]
          out = [
              '/* =========================================================',
              '   LUEN SITE OVERRIDES · CONSOLIDATED 2026-08-23',
              '   Cascade order preserved from the previous production load:',
              '   platform-base → initial-theme → site-current →',
              '   content-desktop → content-video-base → visual-simplify.',
              '   Keep site.css as the frozen legacy baseline.',
              '   ========================================================= */',
              ''
          ]
          for title, content in sections:
              out += [f'/* ===== {title} ===== */', content.strip(), '']
          consolidated = '\n'.join(out).rstrip() + '\n'
          assert '@import' not in consolidated, 'nested @import remains in consolidated CSS'
          assert '.creator-network-showcase' in consolidated
          assert '.market-network-v2' in consolidated
          assert '.luen-content-video' in consolidated
          assert 'STATIC SOURCE CONSOLIDATION' in consolidated
          (css / 'site-overrides.css').write_text(consolidated)

          html = index.read_text()
          old = '''<link rel="stylesheet" href="assets/css/site.css?v=20260823-3"/>
          <link rel="stylesheet" href="assets/css/platform-network.css?v=20260823-3"/>
          <link rel="stylesheet" href="assets/css/site-current.css?v=20260823-3" data-luen-current-styles="true"/>
          <link rel="stylesheet" href="assets/css/content-video.css?v=20260823-3" data-luen-content-video-styles="true"/>'''.replace('          ', '')
          new = '''<link rel="stylesheet" href="assets/css/site.css?v=20260823-5"/>
          <link rel="stylesheet" href="assets/css/site-overrides.css?v=20260823-5" data-luen-current-styles="true"/>'''.replace('          ', '')
          assert html.count(old) == 1, 'expected stylesheet link block not found exactly once'
          html = html.replace(old, new, 1)
          index.write_text(html)
          PY

      - name: Remove superseded CSS layer files
        run: |
          git rm \
            assets/css/platform-network.css \
            assets/css/platform-network-base.css \
            assets/css/initial-theme.css \
            assets/css/site-current.css \
            assets/css/content-video.css \
            assets/css/content-video-base.css \
            assets/css/content-desktop.css \
            assets/css/visual-simplify.css

      - name: Validate flattened CSS architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          css=Path('assets/css/site-overrides.css').read_text()
          links=re.findall(r'<link[^>]+href="assets/css/([^"?]+)',html)
          assert links == ['site.css','site-overrides.css'], links
          assert '@import' not in css
          assert len(css) > 45000, len(css)
          for marker in ['creator-network-showcase','outcome-strip','market-network-v2','luen-content-video','footer-business-info']:
              assert marker in css, marker
          for old in ['platform-network.css','initial-theme.css','site-current.css','content-video.css','content-desktop.css','visual-simplify.css']:
              assert old not in html, old
          print('CSS architecture:', links)
          print('Consolidated bytes:', len(css.encode()))
          PY
          node --check assets/js/site.js
          node --check assets/js/site-core.js
          git diff --check

      - name: Commit consolidation and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/consolidate-css.yml
          git add index.html assets/css/site-overrides.css
          git add -u assets/css
          git commit -m 'Flatten homepage CSS into one override layer'
          git push origin HEAD:main
