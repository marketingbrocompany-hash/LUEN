name: LUEN hero webfont CLS diagnostics (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-hero-font-cls-diagnostics.mjs'
      - '.github/workflows/qa-hero-font-cls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hero-font-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers and syntax-check diagnostic
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          node --check scripts/qa-hero-font-cls-diagnostics.mjs
          node scripts/check-site.mjs
      - name: Serve unchanged main checkout without deployment
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/luen-cls-http.log 2>&1 &
          for i in {1..30}; do curl -fsSo /dev/null http://127.0.0.1:4173/ && exit 0; sleep 1; done
          cat /tmp/luen-cls-http.log
          exit 1
      - name: Diagnose Chromium and WebKit font swaps on 6 widths
        env:
          LUEN_QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-hero-font-cls-diagnostics.mjs
      - name: Save diagnostic reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-hero-font-cls-diagnostics
          path: qa-screenshots/hero-font-cls-diagnostics/
          retention-days: 14
          if-no-files-found: warn
