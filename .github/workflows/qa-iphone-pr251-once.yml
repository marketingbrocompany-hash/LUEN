name: LUEN PR251 one-time authorized real iPhone Safari run
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/qa-iphone-pr251-once.yml'
permissions:
  contents: read
concurrency:
  group: luen-iphone-pr251-authorized
  cancel-in-progress: false
jobs:
  real-iphone-pr251:
    if: ${{ github.event.pull_request.number == 251 && github.event.pull_request.head.repo.full_name == 'marketingbrocompany-hash/LUEN' && github.head_ref == 'qa/real-iphone-20261029-services-cases' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exactly the intended PR251 browser test
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "qa/real-iphone-20261029-services-cases"
          node --check scripts/qa-browserstack-real-iphone.mjs
      - name: Install mobile WebDriver runner
        run: npm install --no-save --no-package-lock selenium-webdriver@4.37.0
      - name: Execute exactly one read-only physical iPhone Safari QA
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_DEVICE: iPhone 16
          BROWSERSTACK_OS_VERSION: '18'
        run: |
          set -euo pipefail
          if [[ -z "$BROWSERSTACK_USERNAME" || -z "$BROWSERSTACK_ACCESS_KEY" ]]; then
            echo "::error::BrowserStack Automate credentials not configured."
            exit 2
          fi
          node scripts/qa-browserstack-real-iphone.mjs
