name: LUEN one-time creator cover retrieval
on:
  push:
    branches:
      - fix/masubuchi-thumbnail-quality-20261019
    paths:
      - .github/workflows/creator-cover-retrieval.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Resolve approved public Instagram reel cover photos
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, html, urllib.request, urllib.parse, urllib.error, urllib.parse as urlp
          from html.parser import HTMLParser
          from pathlib import Path

          shortcodes=["DWn-bFBARLT","Dc5tHpyhAbX","Ddi5Yc6h_Zu","DaM3mwqhQSI"]
          output=Path("assets/images/creators/masubuchi")
          output.mkdir(parents=True,exist_ok=True)
          class MetaReader(HTMLParser):
              def __init__(self): super().__init__(); self.images=[]
              def handle_starttag(self, tag, attrs):
                  if tag!="meta": return
                  d=dict(attrs)
                  if d.get("property") in ("og:image","og:image:secure_url") or d.get("name")=="twitter:image":
                      if d.get("content"): self.images.append(html.unescape(d["content"]))
          def open_url(url, headers=None):
              h={"User-Agent":"facebookexternalhit/1.1","Accept":"text/html,application/json,image/avif,image/webp,image/*;q=0.8,*/*;q=0.7"}
              if headers: h.update(headers)
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=16) as resp:
                  if int(resp.status)>=400: raise Exception("HTTP "+str(resp.status))
                  return resp.read(4_000_000),resp.headers.get("Content-Type","")
          def safe_media(uri):
              try:
                  u=urlp.urlparse(uri)
                  host=(u.hostname or "").lower()
                  return u.scheme=="https" and (host.endswith(".fbcdn.net") or host.endswith(".cdninstagram.com") or host.endswith(".instagram.com") or host=="instagram.com" or host=="scontent.cdninstagram.com")
              except: return False
          for code in shortcodes:
              urls=[f"https://www.instagram.com/reel/{code}/",f"https://www.instagram.com/reel/{code}/embed/"]
              photos=[]
              for u in urls:
                  try:
                      body,typ=open_url(u)
                      parser=MetaReader();parser.feed(body.decode("utf-8","ignore"))
                      photos+=parser.images
                      print(code,"html",len(body),"og_candidates",len(parser.images))
                  except Exception as e:
                      print(code,"html_error",type(e).__name__,str(e)[:90])
              try:
                  endpoint="https://graph.facebook.com/v25.0/instagram_oembed?"+urlp.urlencode({"url":urls[0],"omitscript":"true"})
                  body,typ=open_url(endpoint)
                  record=json.loads(body)
                  if record.get("thumbnail_url"):photos.append(record["thumbnail_url"])
                  print(code,"oembed_candidate",bool(record.get("thumbnail_url")))
              except Exception as e:
                  print(code,"oembed_error",type(e).__name__,str(e)[:90])
              written=False
              for uri in photos:
                  if not safe_media(uri):continue
                  try:
                      data,typ=open_url(uri,{"User-Agent":"Mozilla/5.0"})
                      magic=(data.startswith(b"\xff\xd8\xff"),data.startswith(b"\x89PNG"),data.startswith(b"RIFF") and data[8:12]==b"WEBP")
                      if not any(magic) or len(data)<8000 or len(data)>2_000_000:continue
                      ext=("jpg" if magic[0] else "png" if magic[1] else "webp")
                      file=output/(code+"."+ext)
                      file.write_bytes(data)
                      print(code,"saved",file,"bytes",len(data))
                      written=True
                      break
                  except Exception as e:
                      print(code,"image_error",type(e).__name__,str(e)[:90])
              if not written:print(code,"NO_PUBLIC_COVER")
          PY
      - name: Commit valid verified public covers to this isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/creators/masubuchi/
          if git diff --cached --quiet; then echo "No images available from Instagram public metadata"; exit 0; fi
          git commit -m "assets: store published creator reel cover images"
          git push origin HEAD:fix/masubuchi-thumbnail-quality-20261019
