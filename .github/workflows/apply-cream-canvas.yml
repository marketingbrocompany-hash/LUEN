name: Apply cream canvas

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'unify-project-inquiry-cream' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unify-project-inquiry-cream
          fetch-depth: 0
      - name: Apply theme
        run: python .github/scripts/apply-cream-canvas.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/platform-network.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Unify homepage background with Project Inquiry"
          git push origin HEAD:unify-project-inquiry-cream
