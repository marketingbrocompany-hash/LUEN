name: Merge Identity and Platforms into one section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-identity-platform.yml'

permissions:
  contents: write

jobs:
  merge-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge homepage sections
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          css_path = Path('assets/css/site-overrides.css')
          html = index_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          start_marker = '<!-- IDENTITY -->'
          end_marker = '<!-- YOUTUBE -->'
          assert html.count(start_marker) == 1, html.count(start_marker)
          assert html.count(end_marker) == 1, html.count(end_marker)

          start = html.index(start_marker)
          end = html.index(end_marker)
          old_block = html[start:end]
          assert '<!-- MARKET / PLATFORMS -->' in old_block

          identity_section, platform_section = old_block.split('<!-- MARKET / PLATFORMS -->', 1)
          identity_prefix = '<!-- IDENTITY -->\n<section class="identity" id="about">\n<div class="container">\n'
          identity_suffix = '\n</div>\n</section>\n'
          assert identity_section.startswith(identity_prefix)
          assert identity_section.endswith(identity_suffix)
          identity_inner = identity_section[len(identity_prefix):-len(identity_suffix)]

          map_marker = '<div aria-label="한국과 일본 플랫폼 네트워크" class="market-map sr d1">'
          assert platform_section.count(map_marker) == 1
          map_start = platform_section.index(map_marker)
          platform_tail = platform_section[map_start:]
          platform_suffix = '\n</div>\n</section>\n'
          assert platform_tail.endswith(platform_suffix)
          map_html = platform_tail[:-len(platform_suffix)]

          merged = f'''<!-- IDENTITY × PLATFORMS -->
<section class="identity identity-platform-section" id="about">
<div class="container identity-platform-shell">
{identity_inner}
<div class="platform-network-inline market-network-v2" id="platforms">
{map_html}
</div>
</div>
</section>
'''

          html = html[:start] + merged + html[end:]
          html = html.replace('assets/css/site-overrides.css?v=20260823-6', 'assets/css/site-overrides.css?v=20260823-7')

          css_marker = '/* TRUE IDENTITY × PLATFORMS MERGE · 2026-08-23 */'
          assert css_marker not in css
          css += r'''

/* TRUE IDENTITY × PLATFORMS MERGE · 2026-08-23 */
.identity-platform-section{
  position:relative!important;
  padding:108px 0 118px!important;
  background:#F5F3EE!important;
  background-image:none!important;
  color:#171614!important;
}
.identity-platform-section::before,
.identity-platform-section::after,
#platforms::before,
#platforms::after{
  content:none!important;
  display:none!important;
  background-image:none!important;
}
.identity-platform-section .identity-top .eyebrow{display:none!important}
.identity-platform-section .identity-statement{max-width:760px!important}
.identity-platform-section .identity-signature{margin-top:54px!important}
body #platforms.market-network-v2{
  display:block!important;
  margin-top:68px!important;
  padding:0!important;
  background:transparent!important;
  background-image:none!important;
  color:#171614!important;
}
body #platforms.market-network-v2 .market-v2-head{display:none!important}
body #platforms.market-network-v2 .market-map{
  margin:0!important;
  background:#F5F3EE!important;
  background-image:none!important;
  border-color:#E9E6DF!important;
  box-shadow:none!important;
}
body #platforms.market-network-v2 .market-map-lines{display:none!important}

@media(max-width:900px){
  .identity-platform-section{padding:92px 0 102px!important}
  .identity-platform-section .identity-signature{margin-top:44px!important}
  body #platforms.market-network-v2{margin-top:54px!important;padding:0!important}
}
@media(max-width:767px){
  .identity-platform-section{padding:76px 0 82px!important}
  .identity-platform-section .identity-signature{margin-top:36px!important}
  body #platforms.market-network-v2{margin-top:42px!important;padding:0!important}
  body #platforms.market-network-v2 .market-map{margin:0!important}
}
@media(max-width:420px){
  .identity-platform-section{padding:68px 0 74px!important}
  body #platforms.market-network-v2{margin-top:36px!important}
}
'''

          assert html.count('class="identity identity-platform-section" id="about"') == 1
          assert html.count('class="platform-network-inline market-network-v2" id="platforms"') == 1
          assert '<section class="market-section market-network-v2" id="platforms">' not in html
          assert '<section class="identity" id="about">' not in html
          assert '<div class="market-v2-head sr">' not in html
          assert html.count('한국과 일본 플랫폼 네트워크') == 1
          assert html.count('BRAND MESSAGE') >= 1
          assert html.count('AUDIENCE INTEREST') >= 1
          assert html.count('CROSS-BORDER<br/>ORCHESTRATION') == 1
          for label in ['jp-youtube','jp-instagram','jp-tiktok','jp-x','jp-ameba','kr-google','kr-youtube','kr-instagram','kr-naver']:
              assert label in html
          assert 'G-QXBK6XEK7G' in html
          assert 'https://formspree.io/f/xaewddev' in html
          assert 'assets/css/site-overrides.css?v=20260823-7' in html

          index_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
      - name: Verify runtime syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/site-core.js
      - name: Commit merged section and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/merge-identity-platform.yml
          git add index.html assets/css/site-overrides.css
          git commit -m "Merge Identity and Platforms into one section"
          git push origin HEAD:main
