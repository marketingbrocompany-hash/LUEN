name: Round homepage media and flow cards

on:
  push:
    paths:
      - '.github/workflows/rounding-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final rounding rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/site-overrides.css')
          css = css_path.read_text()
          marker = '/* ROUNDING CONSISTENCY · CASE MEDIA + CONTENT FLOW */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'

          css += r'''

/* ROUNDING CONSISTENCY · CASE MEDIA + CONTENT FLOW */
#cases.case-studies .case-card .case-image,
#cases.case-studies .case-card .case-image img{
  border-radius:22px!important;
  overflow:hidden!important;
  background-clip:padding-box!important;
}
#cases.case-studies .case-card .case-image>span{
  border-radius:12px!important;
  overflow:hidden!important;
}
#youtube .yt-action-flow.content-design-flow article,
#youtube .yt-action-flow.content-design-flow-v9 article,
#youtube .content-design-flow article{
  border-radius:18px!important;
  overflow:hidden!important;
  background-clip:padding-box!important;
}
@media(max-width:767px){
  #cases.case-studies .case-card .case-image,
  #cases.case-studies .case-card .case-image img{border-radius:16px!important}
  #cases.case-studies .case-card .case-image>span{border-radius:10px!important}
  #youtube .yt-action-flow.content-design-flow article,
  #youtube .yt-action-flow.content-design-flow-v9 article,
  #youtube .content-design-flow article{border-radius:14px!important}
}
'''
          css_path.write_text(css)

          index_path = Path('index.html')
          html = index_path.read_text()
          old = 'assets/css/site-overrides.css?v=20260823-8'
          new = 'assets/css/site-overrides.css?v=20260823-9'
          if old not in html and new not in html:
              raise SystemExit('Expected site-overrides cache token not found')
          html = html.replace(old, new)
          index_path.write_text(html)

          assert marker in css_path.read_text()
          assert 'border-radius:22px!important' in css_path.read_text()
          assert 'border-radius:18px!important' in css_path.read_text()
          assert new in index_path.read_text()
          PY
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rounding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site-overrides.css index.html .github/workflows/rounding-fix.yml
          git commit -m "Round case media and content flow cards"
          git push origin main
