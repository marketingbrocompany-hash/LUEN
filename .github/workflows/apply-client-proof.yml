name: Apply client proof update
on:
  push:
    branches: [strengthen-client-proof]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strengthen-client-proof
      - name: Update homepage copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<h2 class="section-title title-two-line"><span>브랜드 메시지는 정확하게.</span><br/><span><em>콘텐츠는 광고 같지 않게.</em></span></h2>', '<h2 class="section-title title-two-line"><span>브랜드 메시지는 정확하게</span><br/><span><em>콘텐츠는 광고 같지 않게</em></span></h2>')
          old='''<div class="container brand-wall-head sr">\n<div><span class="work-lane-code">SELECTED CLIENTS</span><h3>함께한 브랜드</h3></div>\n<p>LUEN과 콘텐츠 캠페인을 함께한 주요 클라이언트를 소개합니다.</p>\n</div>'''
          new='''<div class="container brand-wall-head sr">\n<div><span class="work-lane-code">SELECTED CLIENTS · TRUSTED PARTNERS</span><h3>브랜드의 기준까지 이해하는 캠페인 파트너</h3></div>\n<div class="brand-proof-copy">\n<p>대형 브랜드부터 공공 프로젝트까지, 각 조직의 가이드와 검토 기준에 맞춰 한일 크리에이터 캠페인을 운영해왔습니다.</p>\n<div class="brand-proof-meta" aria-label="기업 캠페인 운영 기준"><span>BRAND GUIDELINE</span><span>MULTI-STEP REVIEW</span><span>LOCAL COMMUNICATION</span><span>CAMPAIGN OPERATION</span></div>\n</div>\n</div>'''
          if old not in s:
              raise SystemExit('client block not found')
          s=s.replace(old,new)
          needle='.case-studies .case-card:nth-child(6)::after{content:"CAMPAIGN 06"}\n</style>'
          addition='.case-studies .case-card:nth-child(6)::after{content:"CAMPAIGN 06"}\n.brand-wall .brand-wall-head{align-items:flex-end;gap:48px}\n.brand-wall .brand-wall-head>div:first-child{max-width:560px}\n.brand-wall .brand-wall-head h3{max-width:560px;line-height:1.28;letter-spacing:-.03em}\n.brand-wall .brand-proof-copy{max-width:570px}\n.brand-wall .brand-proof-copy>p{margin:0;color:var(--muted);font-size:16px;line-height:1.7;word-break:keep-all}\n.brand-wall .brand-proof-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}\n.brand-wall .brand-proof-meta span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted-2);font:700 10px/1 "Inter","Pretendard",sans-serif;letter-spacing:.08em}\n@media(max-width:820px){.brand-wall .brand-wall-head{align-items:flex-start;gap:18px}.brand-wall .brand-proof-copy{max-width:none}.brand-wall .brand-proof-copy>p{font-size:15px}.brand-wall .brand-proof-meta{gap:6px}}\n</style>'
          if needle not in s:
              raise SystemExit('style block not found')
          s=s.replace(needle,addition)
          p.write_text(s)
          Path('.github/workflows/apply-client-proof.yml').unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html .github/workflows/apply-client-proof.yml
          git commit -m "Strengthen client proof section"
          git push origin HEAD:strengthen-client-proof
