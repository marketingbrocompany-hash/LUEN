name: Remove deliverable tags

on:
  push:
    branches:
      - remove-deliverable-tags

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-deliverable-tags
          fetch-depth: 0
      - name: Remove deliverable tags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="guide-tags">\n<span>CONTENT PURPOSE</span><span>CHANNEL FIT</span><span>SHOOTING FLOW</span><span>REQUIRED SCENE</span><span>EXPRESSION GUIDE</span><span>FINAL CHECKLIST</span>\n</div>\n'''
          if s.count(old)!=1:
              raise SystemExit(f'Expected one guide-tags block, found {s.count(old)}')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove deliverable guide tags"
          git push origin HEAD:remove-deliverable-tags
