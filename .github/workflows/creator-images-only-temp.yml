name: Use only provided creator images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/creator-images-only-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove non-provided images and duplicate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('          <figure class="creator-profile-card">')
          end=s.find('        </div></div>', start)
          if start<0 or end<0:
              raise SystemExit('creator figure block not found')
          figures='''          <figure class="creator-profile-card"><img src="assets/images/hero-creators/creator-profile-03.webp" alt="LUEN 크리에이터 프로필 1" width="320" height="320" decoding="async"></figure>
          <figure class="creator-profile-card"><img src="assets/images/hero-creators/creator-profile-01.webp" alt="LUEN 크리에이터 프로필 2" width="320" height="320" decoding="async"></figure>
          <figure class="creator-profile-card"><img src="assets/images/hero-creators/creator-profile-02.webp" alt="LUEN 크리에이터 프로필 3" width="320" height="320" decoding="async"></figure>
'''
          p.write_text(s[:start]+figures+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js
          git commit -m 'Use only provided creator images and remove duplicate'
          git push origin main
