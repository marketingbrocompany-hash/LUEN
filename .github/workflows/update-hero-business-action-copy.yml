name: Update hero business action copy

on:
  push:
    branches:
      - hero-business-action-copy

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-business-action-copy
          fetch-depth: 0
      - name: Update hero copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old_h1='''<h1>\n<span>한국과 일본을</span>\n<span class="line-2">콘텐츠로</span>\n<span>연결합니다.</span>\n</h1>'''
          new_h1='''<h1>\n<span>조회수를 만드는 것과</span>\n<span class="line-2">구매를 만드는 것은 다릅니다.</span>\n</h1>'''
          old_desc='''<p class="hero-desc">\n<span class="hero-desc-line">LUEN은 한국과 일본의 브랜드·크리에이터·소비자를 콘텐츠로 연결합니다.</span>\n<strong>선정부터 콘텐츠 설계·운영·성과 분석까지 하나의 흐름으로 만듭니다.</strong>\n</p>'''
          new_desc='''<p class="hero-desc">\n<span class="hero-desc-line">LUEN은 크리에이터 콘텐츠를 검색·방문·구매·예약 같은</span>\n<strong>실제 행동으로 연결합니다.</strong>\n</p>'''
          for old,new,label in [(old_h1,new_h1,'hero h1'),(old_desc,new_desc,'hero desc')]:
              if s.count(old)!=1:
                  raise SystemExit(f'Expected one {label}, found {s.count(old)}')
              s=s.replace(old,new,1)
          old_script='assets/js/site.js?v=20260820-1'
          new_script='assets/js/site.js?v=20260823-1'
          if s.count(old_script)!=1:
              raise SystemExit(f'Expected one site.js version, found {s.count(old_script)}')
          s=s.replace(old_script,new_script,1)
          index.write_text(s,encoding='utf-8')

          js=Path('assets/js/site.js')
          j=js.read_text(encoding='utf-8')
          old_line="if(line) line.textContent='한국과 일본의 크리에이터 마케팅을 한 팀에서 운영합니다.';"
          new_line="if(line) line.textContent='LUEN은 크리에이터 콘텐츠를 검색·방문·구매·예약 같은';"
          old_strong="if(strong) strong.textContent='크리에이터 발굴·섭외부터 콘텐츠 기획, 현지 커뮤니케이션, 업로드 관리, 성과 분석까지 캠페인 전 과정을 연결합니다.';"
          new_strong="if(strong) strong.textContent='실제 행동으로 연결합니다.';"
          for old,new,label in [(old_line,new_line,'runtime hero line'),(old_strong,new_strong,'runtime hero strong')]:
              if j.count(old)!=1:
                  raise SystemExit(f'Expected one {label}, found {j.count(old)}')
              j=j.replace(old,new,1)
          js.write_text(j,encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/js/site.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/site.js
          git commit -m "Refocus hero copy on business action"
          git push origin HEAD:hero-business-action-copy
