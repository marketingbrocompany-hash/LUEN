name: Update proposal sample caption

on:
  push:
    branches:
      - proposal-sample-caption

permissions:
  contents: write

jobs:
  update-caption:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal-sample-caption
          fetch-depth: 0
      - name: Update caption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<figcaption>01 · CREATOR BRIEF</figcaption>'
          new='<figcaption>01 · CAMPAIGN PROPOSAL SAMPLE</figcaption>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one target caption, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename deliverable caption to proposal sample"
          git push origin HEAD:proposal-sample-caption
