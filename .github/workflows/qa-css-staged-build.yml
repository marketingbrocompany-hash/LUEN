name: LUEN safe CSS staging — lossless build and browser QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-css-staged-lossless.mjs'
      - 'scripts/qa-staged-css-browser.mjs'
      - '.github/workflows/cloudflare-preview.yml'
      - '.github/workflows/qa-css-staged-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and unchanged homepage
        run: |
          node scripts/check-site.mjs
          node --check scripts/build-css-staged-lossless.mjs
          node --check scripts/qa-staged-css-browser.mjs
      - name: Create static _site using exactly source HTML, CSS and public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R assets _site/assets
          cp index.html _site/index.html
          for d in about cases contact insights project-guide services; do
            test -d "$d"
            cp -R "$d" "_site/$d"
          done
          test -s _site/assets/css/site.css
          test -s _site/assets/css/luen-v3.css
      - name: Install PostCSS and WebKit/Chromium
        run: |
          npm install --no-save --no-package-lock postcss@8.5.31 playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Compile CSS in _site only, assert exact AST and source unchanged
        run: |
          node scripts/build-css-staged-lossless.mjs --stage _site
          git diff --exit-code -- index.html assets/css/site.css assets/css/luen-v3.css
          test -s qa-screenshots/css-lossless-staging-report.json
      - name: Host original source and compressed staged page locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4273 --directory . --bind 127.0.0.1 >/tmp/luen-css-source.log 2>&1 &
          python3 -m http.server 4274 --directory _site --bind 127.0.0.1 >/tmp/luen-css-stage.log 2>&1 &
          for p in 4273 4274; do
            for n in {1..20}; do
              if curl -fsS -o /dev/null "http://127.0.0.1:$p/"; then break; fi
              sleep 1
            done
            curl -fsS -o /dev/null "http://127.0.0.1:$p/assets/css/site.css"
            curl -fsS -o /dev/null "http://127.0.0.1:$p/assets/css/luen-v3.css"
          done
      - name: Chromium and WebKit 320, 390, 768 and 1440 typography/CTA QA
        run: node scripts/qa-staged-css-browser.mjs
      - name: Retain build report, no public deployment or originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-ast-lossless-staged-css-build-qa
          path: |
            qa-screenshots/css-lossless-staging-report.json
            qa-screenshots/css-staged-browser-qa.json
          retention-days: 10
          if-no-files-found: warn
