name: Fix mobile portfolio loop resize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-portfolio-loop-temp.yml'

permissions:
  contents: write

jobs:
  fix-mobile-portfolio-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prevent mobile toolbar resize from resetting portfolio loops
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/site.js')
          s = p.read_text(encoding='utf-8')
          old = """  function initLoopStrips(){document.querySelectorAll('[data-loop-strip]').forEach(setupLoopStrip);}\n  window.addEventListener('load',()=>requestAnimationFrame(initLoopStrips));\n  window.addEventListener('resize',()=>{clearTimeout(window.__luenLoopResize);window.__luenLoopResize=setTimeout(initLoopStrips,180);});"""
          new = """  function initLoopStrips(){document.querySelectorAll('[data-loop-strip]').forEach(setupLoopStrip);}\n  window.addEventListener('load',()=>requestAnimationFrame(initLoopStrips));\n\n  // Mobile browsers fire resize while the address/navigation bars show and hide during vertical scrolling.\n  // Rebuilding the infinite-loop strips on those height-only resizes resets the thumbnails and can glitch\n  // when the user scrolls away from Selected Work and comes back. Only rebuild when viewport width changes.\n  let lastLoopViewportWidth=document.documentElement.clientWidth;\n  window.addEventListener('resize',()=>{\n    const nextWidth=document.documentElement.clientWidth;\n    if(Math.abs(nextWidth-lastLoopViewportWidth)<2)return;\n    lastLoopViewportWidth=nextWidth;\n    clearTimeout(window.__luenLoopResize);\n    window.__luenLoopResize=setTimeout(initLoopStrips,180);\n  },{passive:true});"""
          if old not in s:
              raise SystemExit('Expected loop resize block was not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js
          git commit -m 'Fix mobile Selected Work loop on vertical scroll'
          git push origin main
