name: Remove private brand labels

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-private-brand-labels
          fetch-depth: 0
      - name: Remove private brand labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=' · 브랜드 비공개'
          count=s.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 labels, found {count}')
          p.write_text(s.replace(old,''),encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove private brand labels from case studies"
          git push origin HEAD:remove-private-brand-labels
