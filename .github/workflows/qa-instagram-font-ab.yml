name: LUEN Instagram font subset A/B
on:
  pull_request:
    paths:
      - 'services/instagram-influencer-marketing/index.html'
      - 'scripts/qa-instagram-font-ab.mjs'
      - '.github/workflows/qa-instagram-font-ab.yml'
permissions:
  contents: read
jobs:
  font-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integrity
        run: node scripts/check-site.mjs
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare Instagram full vs subset font under identical markup
        run: node scripts/qa-instagram-font-ab.mjs
      - name: Retain screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-instagram-font-subset-ab
          path: qa-screenshots/instagram-font-ab/
          if-no-files-found: warn
          retention-days: 14
