name: Remove section subtitles from Selected Work onward

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-section-subtitles-temp.yml'

permissions:
  contents: write

jobs:
  remove-subtitles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove section-copy subtitles after Selected Work
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- WORK -->'
          if marker not in s:
              raise SystemExit('WORK marker not found')

          before, after = s.split(marker, 1)
          pattern = re.compile(r'<p\s+class="[^"]*\bsection-copy\b[^"]*"[^>]*>.*?</p>', re.S)
          matches = pattern.findall(after)
          if not matches:
              raise SystemExit('No section-copy subtitles found after WORK')

          after = pattern.sub('', after)
          p.write_text(before + marker + after, encoding='utf-8')
          print(f'Removed {len(matches)} section subtitles')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove section subtitles from Selected Work onward'
          git push origin main
