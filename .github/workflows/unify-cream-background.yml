name: Unify homepage cream background

on:
  push:
    branches:
      - unify-project-inquiry-cream

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unify-project-inquiry-cream
          fetch-depth: 0
      - name: Apply Project Inquiry cream canvas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/css/platform-network.css')
          s=css.read_text(encoding='utf-8')
          marker='/* PROJECT INQUIRY CREAM CANVAS */'
          if marker not in s:
              block=Path('.github/workflows/cream-theme-block.txt').read_text(encoding='utf-8')
              css.write_text(s.rstrip()+'\n\n'+block.strip()+'\n',encoding='utf-8')
          index=Path('index.html')
          h=index.read_text(encoding='utf-8')
          old='assets/css/platform-network.css?v=20260820-4'
          new='assets/css/platform-network.css?v=20260823-5'
          if old in h: h=h.replace(old,new,1)
          elif new not in h: raise SystemExit('platform-network version reference mismatch')
          index.write_text(h,encoding='utf-8')
          updated=css.read_text(encoding='utf-8')
          if updated.count('{')!=updated.count('}'): raise SystemExit('CSS brace mismatch')
          if updated.count(marker)!=1: raise SystemExit('cream marker mismatch')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/platform-network.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Unify homepage background with Project Inquiry"
          git push origin HEAD:unify-project-inquiry-cream
