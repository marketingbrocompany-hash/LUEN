name: Fix creator broken images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creator-broken-images-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace broken creator image paths and bust cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site.js')
          s=p.read_text(encoding='utf-8')
          reps={
            'assets/images/hero-creators/creator-extra-01.jpg':'assets/images/hero-creators/creator-extra-v2-01.webp',
            'assets/images/hero-creators/creator-extra-02.jpg':'assets/images/hero-creators/creator-extra-v2-02.webp',
            'assets/images/hero-creators/creator-extra-03.jpg':'assets/images/hero-creators/creator-extra-v2-03.webp',
            'assets/images/hero-creators/creator-extra-04.jpg':'assets/images/hero-creators/creator-extra-v2-04.webp',
          }
          for a,b in reps.items():
              s=s.replace(a,b)
          s=s.replace("site-core.js?v=20260819h","site-core.js?v=20260819i")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script src="assets/js/site\.js(?:\?v=[^"]*)?"></script>', '<script src="assets/js/site.js?v=20260819-1312"></script>', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js index.html
          git commit -m 'Fix broken creator image assets'
          git push origin main
