name: LUEN Cloudflare Preview

# This is an opt-in deployment of the isolated luen-preview.pages.dev site.
# It never updates GitHub main or the luenkorea.com domain.
on:
  push:
    branches:
      - luen-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luen-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    # Keep disabled until the user adds two repository secrets and explicitly
    # sets LUEN_PAGES_DEPLOY_ENABLED=true in GitHub Actions variables.
    if: ${{ vars.LUEN_PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout approved preview code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check website integrity before deployment
        run: node scripts/check-site.mjs

      - name: Stage only public site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for item in assets about cases contact creators insights project-guide services; do
            test -d "$item"
            cp -R "$item" _site/
          done
          for item in index.html 404.html privacy.html robots.txt sitemap.xml site.webmanifest naver9690e9bb238369713989a6f11a99c636.html; do
            test -f "$item"
            cp "$item" _site/
          done
          test -f _site/index.html
          test -f _site/assets/css/luen-finish.css
          test -f _site/assets/js/site-core.js
          # Intentionally excludes .github/, docs/, scripts/, README.txt,
          # stale asset-manifest.json and CNAME (the live custom domain).
          echo "Prepared isolated Cloudflare Pages site payload."

      - name: Generate clinic hero 00-second thumbnail from approved clip
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/assets/video/luen-motion/clinic-preview.mp4
          # Hosted runner images can omit FFmpeg. Install only when absent.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg is missing on the runner; installing for thumbnail extraction."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          # Build-time derivation, not a re-encode of the hero video.
          # Guarantees the image exactly matches the first frame of the clip.
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -ss 0 -i _site/assets/video/luen-motion/clinic-preview.mp4 \
            -frames:v 1 -c:v libwebp -quality 88 \
            _site/assets/images/luen-motion/clinic-poster.webp
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=s=x:p=0 \
            _site/assets/images/luen-motion/clinic-poster.webp)" = "406x720"
          test "$(stat -c%s _site/assets/images/luen-motion/clinic-poster.webp)" -gt 8000
          echo "Clinic poster is now the 00-second frame at original 406x720."

      - name: Minify public CSS without removing selectors
        run: |
          npm install --no-save --no-package-lock lightningcss@1.30.2
          node scripts/minify-preview-css.mjs

      - name: Confirm deployment credentials exist
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing Cloudflare GitHub Actions secrets. Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Deploy to LUEN Cloudflare development site only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Cloudflare Direct Upload project uses "main" as production branch.
          # This updates luen-preview.pages.dev, NOT luenkorea.com.
          command: pages deploy _site --project-name=luen-preview --branch=main

      - name: Install browser test runner
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify live Cloudflare page on desktop and mobile
        env:
          LUEN_QA_URL: https://luen-preview.pages.dev
        run: node scripts/qa-live.mjs

      - name: Validate LUEN IN MOTION real video playback on desktop and mobile
        env:
          LUEN_QA_URL: https://luen-preview.pages.dev
        run: node scripts/qa-hero-video.mjs

      - name: Verify all public routes before production approval
        env:
          LUEN_QA_URL: https://luen-preview.pages.dev
        run: node scripts/qa-subpages.mjs

      - name: Simulate inquiry validation and both server response states
        env:
          LUEN_QA_URL: https://luen-preview.pages.dev
        run: node scripts/qa-contact-flow.mjs

      - name: Keep screenshots and QA findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-live-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
