name: LUEN UX combined isolated Cloudflare review

# Temporary, PR-scoped review deployment. Never deploy to the Pages project's
# main branch, production hostname, or the existing development-site root.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/review-ux-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luen-ux-combined-review-only
  cancel-in-progress: true

jobs:
  isolated-review:
    if: ${{ vars.LUEN_PAGES_DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/ux-service-gallery-20261025' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the integration candidate (never main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source integrity
        run: node scripts/check-site.mjs
      - name: Stage reviewed static site without custom-domain files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for item in assets about cases contact creators insights project-guide services; do
            test -d "$item"
            cp -R "$item" _site/
          done
          for item in index.html 404.html privacy.html robots.txt sitemap.xml site.webmanifest naver9690e9bb238369713989a6f11a99c636.html; do
            test -f "$item"
            cp "$item" _site/
          done
          test ! -e _site/CNAME
          test ! -e _site/.github
          test -s _site/creators/masubuchi-sachiyo/index.html
          test -s _site/assets/css/creator-partnerships.css
          grep -Fq 'service=youtube-longform' _site/index.html
          grep -Fq 'portfolio-explore-link' _site/index.html
          cat > _site/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
          EOF
          grep -Fq 'X-Robots-Tag: noindex' _site/_headers
      - name: Require existing Cloudflare repo secrets
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::Cloudflare repository secrets unavailable; review upload cancelled."
            exit 1
          fi
      - name: Upload only to a NON-PRODUCTION Pages branch
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=luen-preview --branch=ux-215-216-review
      - name: Verify non-production URL and noindex
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_URL"
          case "$DEPLOYED_URL" in
            https://*.luen-preview.pages.dev*) ;;
            *) echo "::error::Unexpected Cloudflare preview URL: $DEPLOYED_URL"; exit 1;;
          esac
          if [ "$DEPLOYED_URL" = "https://luen-preview.pages.dev" ] || [ "$DEPLOYED_URL" = "https://luen-preview.pages.dev/" ]; then
            echo "::error::Refusing to treat Pages root as review"; exit 1
          fi
          echo "Isolated QA site: $DEPLOYED_URL"
          for route in / /contact/ /creators/masubuchi-sachiyo/; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 30 "$DEPLOYED_URL$route")"
            if [ "$status" != "200" ]; then
              echo "::error::Isolated site $route returned $status"; exit 1
            fi
            headers="$(curl -sSI --max-time 30 "$DEPLOYED_URL$route")"
            if ! printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:[[:space:]]*.*noindex'; then
              echo "::error::Missing noindex on $route"; exit 1
            fi
          done
          echo "All three review routes are 200 and noindex. Neither production hostname nor Pages main branch was changed."
