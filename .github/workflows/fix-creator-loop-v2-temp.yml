name: Apply LUEN typography readability pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creator-loop-v2-temp.yml'

permissions:
  contents: write

jobs:
  apply-typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Increase client-facing text readability
        shell: bash
        run: |
          cat >> assets/css/site.css <<'CSS'

          /* === LUEN READABILITY OVERRIDE V11 START === */
          /* Client-facing typography optimization. Large hero/section headlines intentionally untouched. */
          :root{
            --luen-text-lg:clamp(17px,1.05vw,19px);
            --luen-text-md:clamp(16px,.92vw,17px);
            --luen-text-sm:clamp(14px,.78vw,15px);
            --luen-label:clamp(12px,.70vw,13px);
            --luen-ui:clamp(14px,.82vw,16px);
          }
          body{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%}

          .hero-desc,.section-copy,.work-story-copy,.identity-purpose,.contact-copy,.final-scene-inner>p,.proof-item>p,.case-desc,.case-inquiry-copy>p,.guide-proof-note>p,.faq-a>p,.faq-conversion>p{
            font-size:var(--luen-text-lg)!important;line-height:1.72!important;letter-spacing:-.018em;word-break:keep-all;overflow-wrap:break-word
          }
          .hero-kicker,.hero-meta span,.lhn-status span,.lhn-pills span{font-size:var(--luen-label)!important}
          .hero-kicker{letter-spacing:.08em}.hero-meta span{line-height:1.4}
          .lhn-card p{font-size:var(--luen-text-sm)!important;line-height:1.55!important}
          .lhn-card h3{font-size:clamp(17px,1vw,20px)!important}.lhn-hub span{font-size:12px!important}

          .nav-links a,.nav-contact,.btn,.case-inquiry-btn,.faq-cta,.mobile-case-more,.form-reset{font-size:var(--luen-ui)!important;line-height:1.25}
          .top-strip-set span,.top-strip-set b,.marquee-set span{font-size:clamp(11px,.66vw,13px)!important}

          .eyebrow,.proof-kicker,.work-lane-code,.final-kicker,.signature-label,.data-source-badge,.sample-badge,.form-success-kicker{font-size:var(--luen-label)!important;line-height:1.35!important}

          .identity-side strong{font-size:clamp(20px,1.45vw,25px)!important;line-height:1.35!important}
          .identity-side p{font-size:var(--luen-text-sm)!important;line-height:1.55!important}
          .identity-core small{font-size:12px!important}

          .portfolio-head span,.portfolio-head small,.portfolio-country,.portfolio-meta span{font-size:var(--luen-label)!important;line-height:1.3!important}
          .portfolio-head h3{font-size:clamp(20px,1.5vw,26px)!important;line-height:1.15!important}
          .portfolio-meta b{font-size:clamp(14px,.85vw,16px)!important;line-height:1.25!important}

          .brand-wall-head h3{font-size:clamp(22px,1.45vw,28px)!important}
          .brand-wall-head p{font-size:var(--luen-text-md)!important;line-height:1.6!important}
          .client-logo{font-size:clamp(15px,.95vw,18px)!important}

          .market-side-label span{font-size:clamp(13px,.8vw,15px)!important}
          .market-side-label small,.market-hub small,.market-map-caption span,.market-map-caption b{font-size:clamp(11px,.68vw,13px)!important}
          .platform-node b{font-size:clamp(15px,.92vw,17px)!important}.platform-node span{font-size:clamp(12px,.72vw,14px)!important}

          .lcs-head span{font-size:clamp(13px,.78vw,15px)!important}.lcs-head small{font-size:clamp(11px,.67vw,13px)!important}
          .lcs-node b{font-size:clamp(13px,.82vw,15px)!important}.lcs-node small{font-size:clamp(11px,.70vw,13px)!important}
          .yt-action-flow article>span{font-size:var(--luen-label)!important}.yt-action-flow article>b{font-size:clamp(15px,.9vw,17px)!important}
          .yt-action-flow article>p{font-size:var(--luen-text-sm)!important;line-height:1.62!important;word-break:keep-all}
          .yt-thesis,.content-thesis{font-size:clamp(14px,.85vw,16px)!important;line-height:1.5!important}

          .guide-tags span{font-size:clamp(12px,.72vw,14px)!important}
          .guide-proof-note b,.guide-page figcaption,.chart-head span,.chart-head b,.chart-labels span,.metric-row article span,.metric-row article small{font-size:clamp(11px,.68vw,13px)!important;line-height:1.35!important}
          .growth-value{font-size:14px!important}

          .case-body>small,.case-cat,.case-metric span{font-size:var(--luen-text-sm)!important;line-height:1.5!important}
          .case-body h3{font-size:clamp(22px,1.55vw,28px)!important;line-height:1.25!important}
          .case-metric strong{font-size:clamp(19px,1.3vw,24px)!important;line-height:1.3!important}
          .case-inquiry-copy>span{font-size:var(--luen-label)!important}.case-inquiry-copy>h3{font-size:clamp(20px,1.35vw,25px)!important}

          .campaign-control article>i,.timeline-shell article>span,.campaign-control article>small,.campaign-output>span{font-size:var(--luen-label)!important;line-height:1.35!important}
          .campaign-control article>b,.timeline-shell article>b{font-size:clamp(16px,.95vw,18px)!important;line-height:1.35!important}
          .campaign-control article>p,.timeline-shell article>p{font-size:var(--luen-text-sm)!important;line-height:1.58!important;word-break:keep-all}
          .campaign-output>b,.campaign-output>strong{font-size:clamp(13px,.78vw,15px)!important}

          .voice-item>span,.voice-item>p{font-size:var(--luen-label)!important}
          .voice-item blockquote{font-size:clamp(19px,1.35vw,24px)!important;line-height:1.65!important;letter-spacing:-.02em;word-break:keep-all}

          .faq-q{font-size:clamp(17px,1.02vw,19px)!important;line-height:1.48!important}.faq-icon{font-size:22px!important}

          .field label,.privacy-check-copy b,.privacy-details summary{font-size:clamp(14px,.82vw,16px)!important;line-height:1.45!important}
          .field input,.field select,.field textarea{font-size:16px!important;line-height:1.5!important}
          .field input::placeholder,.field textarea::placeholder{font-size:15px!important}
          .privacy-check-copy small,.privacy-detail-body,.privacy-external,.form-feedback,.form-success p{font-size:clamp(13px,.76vw,15px)!important;line-height:1.62!important}
          .form-success strong{font-size:clamp(20px,1.25vw,24px)!important}

          .footer-brand p,.footer-links a,.footer-bottom p{font-size:clamp(13px,.76vw,15px)!important;line-height:1.45!important}

          .section-copy,.case-desc,.faq-a p,.voice-item blockquote,.contact-copy,.campaign-control p,.timeline-shell p,.yt-action-flow p{max-width:68ch}

          @media(max-width:900px){
            :root{--luen-text-lg:clamp(16.5px,2.1vw,18px);--luen-text-md:clamp(15.5px,1.95vw,17px);--luen-text-sm:clamp(14px,1.8vw,15.5px);--luen-label:clamp(12px,1.55vw,13.5px);--luen-ui:clamp(14px,1.8vw,16px)}
            .voice-item blockquote{font-size:clamp(18px,2.6vw,22px)!important}
          }
          @media(max-width:640px){
            body{font-size:16px}
            :root{--luen-text-lg:16.5px;--luen-text-md:16px;--luen-text-sm:14.5px;--luen-label:12px;--luen-ui:15px}
            .hero-desc,.section-copy,.work-story-copy,.identity-purpose,.contact-copy,.final-scene-inner>p,.faq-a>p,.faq-conversion>p{line-height:1.68!important}
            .faq-q{font-size:16.5px!important}.voice-item blockquote{font-size:18px!important;line-height:1.62!important}
            .case-body h3{font-size:22px!important}.field input,.field select,.field textarea{font-size:16px!important}
          }
          /* === LUEN READABILITY OVERRIDE V11 END === */
          CSS

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site.css
          git diff --cached --quiet && exit 0
          git commit -m 'Increase client-facing text readability'
          git push origin main
