name: Fix creator and selected work loops v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-creator-loop-v2-temp.yml'

permissions:
  contents: write

jobs:
  fix-loops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make creator and Selected Work loops deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site.js')
          s=p.read_text(encoding='utf-8')

          # Do not disable the creator carousel on mobile accessibility settings; this section is intentionally animated.
          s=s.replace("    @media(prefers-reduced-motion:reduce){.creator-profile-viewport{overflow-x:auto;scrollbar-width:none}.creator-profile-viewport::-webkit-scrollbar{display:none}.creator-profile-track{transform:none!important}}\n", "")

          start=s.find("  const viewport=document.querySelector('.creator-profile-viewport');")
          end=s.find("  const core=document.createElement('script');", start)
          if start < 0 or end < 0:
              raise SystemExit('loop block not found')

          replacement=r'''  const loopStops=[];

  function runContinuousLoop(viewport, trackSelector, setSelector, speed){
    if(!viewport)return ()=>{};
    const track=viewport.querySelector(trackSelector);
    const source=viewport.querySelector(setSelector);
    if(!track||!source)return ()=>{};

    track.querySelectorAll('.luen-runtime-clone').forEach(el=>el.remove());
    track.style.transform='translate3d(0,0,0)';

    let raf=0;
    let offset=0;
    let last=performance.now();
    let baseWidth=0;

    const rebuild=()=>{
      track.querySelectorAll('.luen-runtime-clone').forEach(el=>el.remove());
      baseWidth=source.getBoundingClientRect().width;
      if(!baseWidth)return;
      const copies=Math.max(2,Math.ceil((viewport.clientWidth+baseWidth)/baseWidth)+1);
      for(let i=0;i<copies;i++){
        const clone=source.cloneNode(true);
        clone.classList.add('luen-runtime-clone');
        clone.setAttribute('aria-hidden','true');
        track.appendChild(clone);
      }
      offset%=baseWidth;
    };

    rebuild();
    requestAnimationFrame(rebuild);

    const tick=now=>{
      const dt=Math.min(.05,(now-last)/1000);
      last=now;
      if(baseWidth>0){
        offset=(offset+speed*dt)%baseWidth;
        track.style.transform=`translate3d(${-offset}px,0,0)`;
      }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);

    let previousWidth=document.documentElement.clientWidth;
    const onResize=()=>{
      const nextWidth=document.documentElement.clientWidth;
      if(Math.abs(nextWidth-previousWidth)<2)return;
      previousWidth=nextWidth;
      rebuild();
    };
    window.addEventListener('resize',onResize,{passive:true});

    return ()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('resize',onResize);
    };
  }

  // CREATOR NETWORK: all 7 supplied images, shuffled, continuously moving left.
  loopStops.push(runContinuousLoop(
    document.querySelector('.creator-profile-viewport'),
    '.creator-profile-track',
    '.creator-profile-set:not(.luen-runtime-clone)',
    78
  ));

  // Selected Work uses this runtime loop directly so its speed does not depend on site-core load timing.
  const portfolioLoops=[...document.querySelectorAll('.portfolio-viewport')];
  portfolioLoops.forEach(el=>el.removeAttribute('data-loop-strip'));
  if(portfolioLoops[0]) loopStops.push(runContinuousLoop(portfolioLoops[0],'.portfolio-track','.portfolio-set:not(.luen-runtime-clone)',78));
  if(portfolioLoops[1]) loopStops.push(runContinuousLoop(portfolioLoops[1],'.portfolio-track','.portfolio-set:not(.luen-runtime-clone)',92));

'''
          s=s[:start]+replacement+s[end:]
          s=s.replace("site-core.js?v=20260819h", "site-core.js?v=20260819j")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js
          git commit -m 'Fix creator carousel and Selected Work loop speeds'
          git push origin main
