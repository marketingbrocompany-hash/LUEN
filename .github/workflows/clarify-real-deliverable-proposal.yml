name: Clarify real deliverable proposal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clarify-real-deliverable-proposal
          fetch-depth: 0
      - name: Clarify proposal copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<div class="eyebrow">Real Deliverable · Content Direction</div>':'<div class="eyebrow">Real Deliverable · Campaign Proposal</div>',
            '<div class="guide-proof-note"><b>REAL WORK OUTPUT</b><p>실제 일본 크리에이터 캠페인에서 사용한 가이드 일부를 시각화한 영역입니다.</p></div>':'<div class="guide-proof-note"><b>ACTUAL CAMPAIGN PROPOSAL</b><p>LUEN이 실제 일본 크리에이터 캠페인에서 제작한 콘텐츠 기획안 일부입니다. 촬영 흐름·필수 장면·표현 가이드 등 업로드 전 설계 내용을 담고 있습니다.</p></div>',
            'aria-label="실제 콘텐츠 가이드 문서 일부"':'aria-label="LUEN 실제 콘텐츠 기획안 일부"',
            'alt="촬영 흐름과 필수 촬영 장면이 정리된 실제 가이드 페이지"':'alt="촬영 흐름과 필수 촬영 장면이 정리된 실제 콘텐츠 기획안 페이지"',
            'alt="실제 일본 크리에이터 YouTube 콘텐츠 촬영 가이드 표지"':'alt="실제 일본 크리에이터 YouTube 콘텐츠 기획안 표지"',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify real deliverable as campaign proposal"
          git push origin HEAD:clarify-real-deliverable-proposal
