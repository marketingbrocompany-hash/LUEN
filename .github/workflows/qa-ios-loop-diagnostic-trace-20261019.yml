name: LUEN iOS rail diagnostic trace
on:
  push:
    branches: [fix/ios-portfolio-loop-measurement-20261019]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/luen-ios-server.log 2>&1 &
          sleep 2
      - name: Trace setup width, cloning and reinitialization on WebKit
        run: |
          node --input-type=module <<'JS'
          import {webkit} from 'playwright';
          const browser=await webkit.launch({headless:true});
          const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1';
          const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:2,userAgent:ua});
          await context.route(/(google-analytics|googletagmanager)\.com/,r=>r.abort());
          const page=await context.newPage();
          page.on('console',m=>{if(m.type()==='error'||m.text().startsWith('IOS_'))console.log('BROWSER_TRACE '+m.text().slice(0,600));});
          await page.route('**/assets/js/site.js*',async route=>{
            const original=await route.fetch();
            let s=await original.text();
            const transforms=[
              ['const baseWidth=source.getBoundingClientRect().width;',
              "const baseWidth=source.getBoundingClientRect().width; console.log('IOS_SETUP '+JSON.stringify({label:viewport.className,baseWidth,viewportClientWidth:viewport.clientWidth,winWidth:innerWidth,viewportTop:Math.round(viewport.getBoundingClientRect().top),previousBaseWidth:previous?.baseWidth}));"],
              ['const copies=Math.max(1,Math.ceil(viewport.clientWidth/baseWidth));',
              "const copies=Math.max(1,Math.ceil(viewport.clientWidth/baseWidth));console.log('IOS_COPIES '+JSON.stringify({label:viewport.className,copies,baseWidth,view:viewport.clientWidth}));"],
              ['if(liveWidth>0 && Math.abs(liveWidth-controller.baseWidth)>1){',
              "if(liveWidth>0 && Math.abs(liveWidth-controller.baseWidth)>1){console.log('IOS_SOURCE_CHANGE '+JSON.stringify({label:viewport.className,old:controller.baseWidth,now:liveWidth}));"],
              ['if(liveWidth>0 && (!controller || Math.abs(controller.baseWidth-liveWidth)>1)){',
              "if(liveWidth>0 && (!controller || Math.abs(controller.baseWidth-liveWidth)>1)){console.log('IOS_REVEAL '+JSON.stringify({label:viewport.className,old:controller?.baseWidth,liveWidth,viewportTop:Math.round(viewport.getBoundingClientRect().top)}));"],
              ['const nextWidth=document.documentElement.clientWidth;',
              "const nextWidth=document.documentElement.clientWidth;console.log('IOS_WINDOW_RESIZE '+JSON.stringify({lastWidth,nextWidth}));"]
            ];
            for(const [from,to] of transforms){
              if(!s.includes(from))throw Error('Source injection failed '+from);
              s=s.replace(from,to);
            }
            await route.fulfill({response:original,body:s});
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:50000});
          for(let i=0;i<2;i++){
            await page.locator('.portfolio-viewport').nth(i).scrollIntoViewIfNeeded();
            await page.waitForTimeout(8000);
            console.log('IOS_FINAL '+JSON.stringify(await page.locator('.portfolio-viewport').nth(i).evaluate(el=>({clones:el.querySelectorAll('.ios-loop-clone').length,sourceWidth:el.querySelector('.portfolio-set:not(.ios-loop-clone)')?.getBoundingClientRect().width,viewportWidth:el.clientWidth,winWidth:innerWidth,transform:getComputedStyle(el.querySelector('.loop-track')).transform}))));
          }
          await context.close();await browser.close();
          JS
