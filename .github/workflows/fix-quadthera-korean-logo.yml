name: Fix Quadthera Korean logo

on:
  push:
    branches:
      - fix-quadthera-korean-logo

permissions:
  contents: write

jobs:
  update-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-quadthera-korean-logo
          fetch-depth: 0
      - name: Update Quadthera logo text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old='<span class="client-logo client-quadthera">Quadthera</span>'
          new='<span class="client-logo client-quadthera">쿼드쎄라</span>'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one Quadthera logo, found {s.count(old)}')
          index.write_text(s.replace(old,new,1),encoding='utf-8')

          css=Path('assets/css/site.css')
          c=css.read_text(encoding='utf-8')
          old_css='.client-quadthera{font:650 22px/1 "Inter",sans-serif;letter-spacing:-.035em;min-width:228px}'
          new_css='.client-quadthera{font:650 22px/1 "Pretendard Variable","Pretendard",sans-serif;letter-spacing:-.035em;min-width:228px}'
          if c.count(old_css)!=1:
              raise SystemExit(f'Expected one client-quadthera rule, found {c.count(old_css)}')
          css.write_text(c.replace(old_css,new_css,1),encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/css/site.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/site.css
          git commit -m "Show Quadthera client logo in Korean"
          git push origin HEAD:fix-quadthera-korean-logo
