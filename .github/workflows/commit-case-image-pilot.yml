name: LUEN publish pilot mobile image variants into PR branch only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/commit-case-image-pilot.yml'

permissions:
  contents: write

jobs:
  commit-variants-to-feature-branch-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/case-image-variants-20261025' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the verified isolated PR branch, not main
        uses: actions/checkout@v4
        with:
          ref: perf/case-image-variants-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: pip install pillow==11.3.0
      - name: Generate optimized copies without touching original campaign media
        run: python scripts/pilot-case-image-optimization.py
      - name: Copy ONLY four .webp variants into static-site assets
        shell: bash
        run: |
          set -euo pipefail
          for name in herahera-highres-thumbnail japan-beauty-creator-marketing-case-01 korea-clinic-marketing-case-02 korea-food-marketing-case-04; do
            test -s "perf-case-study/${name}-mobile-test.webp"
            cp "perf-case-study/${name}-mobile-test.webp" "assets/images/cases/${name}-mobile.webp"
          done
          test "$(find assets/images/cases/ -maxdepth 1 -name '*-mobile.webp' | wc -l)" -eq 4
          git diff --exit-code -- assets/images/cases/*thumbnail.webp assets/images/cases/*marketing-case*.webp
      - name: Commit only mobile variants to this PR branch (never force push)
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "perf/case-image-variants-20261025"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/cases/*-mobile.webp
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "Variants already exist; no commit needed."
            exit 0
          fi
          git commit -m "perf: add four visually reviewed mobile case variants (original assets preserved)"
          git push origin HEAD:refs/heads/perf/case-image-variants-20261025
