name: Temporary OG URL Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-og-temp.yml'

permissions:
  contents: write

jobs:
  update-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update OG image URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://luenkorea.com/assets/images/seo/luen-og-1200x630.jpg'
          new = 'https://luenkorea.com/assets/images/seo/luen-og-1200x630-v2.jpg'
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 old OG URLs, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update OG image URL to v2'
          git push origin main
