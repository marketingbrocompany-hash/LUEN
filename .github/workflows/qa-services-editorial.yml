name: LUEN SERVICES editorial typography QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/services-editorial.css'
      - 'scripts/qa-services-editorial.mjs'
      - '.github/workflows/qa-services-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services-editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check homepage CSS and assets
        run: |
          test -s assets/css/services-editorial.css
          node scripts/check-site.mjs
          node --check scripts/qa-services-editorial.mjs
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve immutable PR snapshot on localhost
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/luen-services-qa.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/luen-services-qa.log
          exit 1
      - name: Verify 3 text-only cards at desktop, tablet and mobile breakpoints
        env:
          LUEN_QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-services-editorial.mjs
      - name: Archive SERVICES screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-services-editorial-preview-screenshots
          path: qa-screenshots/services-editorial/
          retention-days: 14
          if-no-files-found: warn
