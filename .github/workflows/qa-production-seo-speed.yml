name: LUEN production SEO and Lighthouse baseline (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-production-seo-speed.yml'
      - 'scripts/qa-production-seo-audit.mjs'
      - 'scripts/lighthouse-preview.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live production pages, sitemap and GA4 tags (no writes)
        run: node scripts/qa-production-seo-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luen-production-technical-seo
          path: seo-audit-results/
          retention-days: 14
          if-no-files-found: warn

  lighthouse-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse and isolated Chrome (no production changes)
        run: |
          npm install --no-save --no-package-lock lighthouse@12.8.2 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Lighthouse mobile 3x and desktop 2x on production
        env:
          LUEN_LIGHTHOUSE_URL: https://luenkorea.com/
        run: node scripts/lighthouse-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luen-production-lighthouse-20261025
          path: lighthouse-results/
          retention-days: 14
          if-no-files-found: warn
