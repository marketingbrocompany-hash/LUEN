name: One-time content headline update

on:
  push:
    branches:
      - update-content-expertise-headline

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-content-expertise-headline
      - name: Update Core Expertise headline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h2 class="section-title title-two-line"><span>브랜드가 기억되는 장면은</span><br/><span><em>콘텐츠로 더 깊게</em> 완성됩니다.</span></h2>'
          new = '<h2 class="section-title title-two-line"><span>브랜드 메시지는 정확하게.</span><br/><span><em>콘텐츠는 광고 같지 않게.</em></span></h2>'
          if old not in s:
              raise SystemExit('target headline not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/update-content-headline.yml
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html .github/workflows/update-content-headline.yml
          git commit -m 'Update Core Expertise headline'
          git push origin HEAD:update-content-expertise-headline
