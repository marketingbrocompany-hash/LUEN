name: LUEN read-only production host and rollback audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-readonly-host-audit.yml'
      - 'scripts/ops-readonly-host-audit.py'

permissions:
  contents: read

jobs:
  discover-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/discover-production-host-20261025' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe public operating domain DNS + headers (GET/HEAD only)
        shell: bash
        run: |
          set -euo pipefail
          echo "===== luenkorea.com DNS records ====="
          dig +short luenkorea.com CNAME || true
          dig +short luenkorea.com A || true
          dig +short www.luenkorea.com CNAME || true
          echo "===== public HTTPS HEAD ====="
          curl -sSIL --max-time 25 https://luenkorea.com/ |
            grep -Ei '^(HTTP/|server:|cf-ray:|x-powered-by:|x-vercel-id:|content-type:|location:|x-robots-tag:)' |
            head -n 26 || true
      - name: Identify exact GitHub Pages source, custom domain, and rollback branch (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          owner='marketingbrocompany-hash'
          target='luenkorea.com'
          found=[]
          for repo in ['LUEN','marketingbrocompany-hash.github.io']:
              url=f'https://api.github.com/repos/{owner}/{repo}/pages'
              request=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      data=json.load(response)
              except urllib.error.HTTPError as e:
                  print('GITHUB_PAGES_QUERY',repo,'HTTP',e.code)
                  continue
              else:
                  result={key:data.get(key) for key in ('html_url','cname','status','build_type','source')}
                  print('GITHUB_PAGES_SITE',repo,json.dumps(result,ensure_ascii=False))
                  if (data.get('cname') or '').lower()==target:
                      found.append({'repo':repo,'source':data.get('source'), 'build_type':data.get('build_type')})
          print('EXACT_GITHUB_PAGES_CUSTOM_DOMAIN_MATCHES',json.dumps(found,ensure_ascii=False))
          if len(found)!=1:
              print('BLOCK_RELEASE: cannot confirm unique GitHub Pages publishing source')
              sys.exit(20)
          source=found[0].get('source') or {}
          if found[0]['repo']!='LUEN' or source.get('branch')!='main' or source.get('path')!='/':
              print('BLOCK_RELEASE: production is not LUEN/main root; need separate source-specific plan')
              sys.exit(21)
          print('GITHUB_PAGES_LUEN_MAIN_ROOT_CONFIRMED')
          PY
