name: Static source consolidation

on:
  push:
    paths:
      - '.github/workflows/static-consolidate.yml'
      - 'tools/consolidate_static.py'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate final homepage source
        run: python tools/consolidate_static.py
      - name: Validate runtime JavaScript
        run: node --check assets/js/site.js
      - name: Validate expected static markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['creator-network-showcase','outcome-strip','capability-strip','luen-content-video','inquiry-reassurance','footer-business-info','site-core.js?v=20260823-3']
          forbidden=['luen-hero-network','site-base.js?v=']
          for x in required:
              assert x in s, x
          for x in forbidden:
              assert x not in s, x
          print('static markers ok')
          PY
      - name: Commit consolidated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/site.js assets/js/site-base.js assets/css/visual-simplify.css assets/css/content-video.css assets/css/platform-network.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Consolidate final homepage design into static source'
            git push origin HEAD:main
          fi
