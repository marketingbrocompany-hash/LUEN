name: LUEN static QA
on:
  pull_request:
  push:
    branches: [main, luen-preview]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify site integrity
        run: node scripts/check-site.mjs
