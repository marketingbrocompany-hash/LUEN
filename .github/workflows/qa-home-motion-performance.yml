name: LUEN homepage motion and font diagnostics
on:
  pull_request:
    paths:
      - 'scripts/qa-home-motion-performance.mjs'
      - '.github/workflows/qa-home-motion-performance.yml'
      - 'assets/js/site-core.js'
      - 'assets/js/luen-motion.js'
      - 'assets/css/luen-motion.css'
      - 'scripts/qa-home-mobile-card-motion.mjs'
      - 'scripts/qa-home-mobile-legibility.mjs'
      - 'assets/css/mobile-legibility.css'
      - 'index.html'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integrity
        run: node scripts/check-site.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve candidate locally without deploying
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/luen-home-perf.log 2>&1 &
          for i in {1..20}; do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && exit 0
            sleep 1
          done
          exit 1
      - name: Check moving rails and font diagnostics
        env:
          LUEN_QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-home-motion-performance.mjs
      - name: Check mobile card-by-card reveal
        env:
          LUEN_QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-home-mobile-card-motion.mjs
      - name: Check mobile text size, contrast and tap targets
        env:
          LUEN_QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-home-mobile-legibility.mjs
      - name: Archive screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-home-motion-font-diagnostics
          path: |
            qa-screenshots/homepage-motion/
            qa-screenshots/mobile-card-motion/
            qa-screenshots/mobile-legibility/
          retention-days: 14
          if-no-files-found: warn
