name: LUEN Interaction QA

on:
  push:
    branches:
      - 'qa/visual-*'

permissions:
  contents: read

jobs:
  interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout latest main
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/luen-http.log 2>&1 &
          echo $! > /tmp/luen-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/luen-http.log
          exit 1

      - name: Run interaction QA
        env:
          TARGET_URL: http://127.0.0.1:4173/
        run: |
          mkdir -p qa-artifacts
          cat > interaction-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const target = process.env.TARGET_URL;
          const report = { target, capturedAt: new Date().toISOString(), tests: [], consoleErrors: [], pageErrors: [] };
          const add = (name, pass, detail = {}) => report.tests.push({ name, pass: Boolean(pass), ...detail });
          const round = n => Math.round(n * 10) / 10;

          async function openPage(page) {
            const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            add('HTTP 200', response && response.status() === 200, { status: response ? response.status() : null, url: page.url() });
            await page.waitForTimeout(1800);
            await page.evaluate(async () => {
              if (document.fonts?.ready) {
                try { await document.fonts.ready; } catch (_) {}
              }
            });
          }

          async function auditSubpage(browser, path, label, extraCheck) {
            const url = new URL(path, target).href;

            for (const spec of [
              { key: 'mobile', width: 390, height: 844 },
              { key: 'desktop', width: 1440, height: 1000 }
            ]) {
              const context = await browser.newContext({ viewport: { width: spec.width, height: spec.height }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(label + ' ' + spec.key + ': ' + msg.text()); });
              page.on('pageerror', err => report.pageErrors.push(label + ' ' + spec.key + ': ' + String(err)));

              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              add(label + ' ' + spec.key + ' HTTP 200', response && response.status() === 200, { status: response ? response.status() : null, url: page.url() });
              await page.waitForTimeout(1500);
              await page.evaluate(async () => {
                if (document.fonts?.ready) {
                  try { await document.fonts.ready; } catch (_) {}
                }
              });

              const basic = await page.evaluate(() => {
                const docWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
                const h1 = document.querySelector('h1');
                const broken = [...document.images].filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src);
                return {
                  docWidth,
                  viewportWidth: window.innerWidth,
                  h1Visible: Boolean(h1 && h1.getBoundingClientRect().width > 0 && h1.getBoundingClientRect().height > 0),
                  h1Text: h1?.textContent?.replace(/\s+/g, ' ').trim() || '',
                  brokenImages: broken
                };
              });
              add(label + ' ' + spec.key + ' no page-level horizontal overflow', basic.docWidth <= spec.width + 1, basic);
              add(label + ' ' + spec.key + ' H1 visible', basic.h1Visible, { h1Text: basic.h1Text });
              add(label + ' ' + spec.key + ' no broken images', basic.brokenImages.length === 0, { brokenImages: basic.brokenImages });

              if (spec.key === 'mobile') {
                const hamburger = page.locator('#hamburger');
                const visible = await hamburger.isVisible();
                add(label + ' mobile hamburger visible', visible);
                if (visible) {
                  await hamburger.click();
                  await page.waitForTimeout(150);
                  const menuOpen = await page.evaluate(() => ({
                    open: document.getElementById('mobileMenu')?.classList.contains('open'),
                    ariaHidden: document.getElementById('mobileMenu')?.getAttribute('aria-hidden'),
                    bodyOverflow: document.body.style.overflow
                  }));
                  add(label + ' mobile menu opens', menuOpen.open && menuOpen.ariaHidden === 'false' && menuOpen.bodyOverflow === 'hidden', menuOpen);
                  await page.keyboard.press('Escape');
                  await page.waitForTimeout(100);
                }
              }

              if (typeof extraCheck === 'function') await extraCheck(page, spec.key);

              await page.screenshot({ path: 'qa-artifacts/' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + spec.key + '.png', fullPage: true });
              await context.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            // MOBILE 390
            {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push('mobile: ' + msg.text()); });
              page.on('pageerror', err => report.pageErrors.push('mobile: ' + String(err)));

              await openPage(page);

              const docWidth = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth));
              add('Mobile no page-level horizontal overflow', docWidth <= 391, { documentWidth: docWidth, viewportWidth: 390 });

              const hamburgerVisible = await page.locator('#hamburger').isVisible();
              add('Mobile hamburger visible', hamburgerVisible);
              if (hamburgerVisible) {
                await page.locator('#hamburger').click();
                await page.waitForTimeout(250);
                const openState = await page.evaluate(() => ({
                  open: document.getElementById('mobileMenu')?.classList.contains('open'),
                  ariaHidden: document.getElementById('mobileMenu')?.getAttribute('aria-hidden'),
                  ariaExpanded: document.getElementById('hamburger')?.getAttribute('aria-expanded'),
                  bodyOverflow: document.body.style.overflow,
                  active: document.activeElement?.id || document.activeElement?.getAttribute?.('aria-label') || document.activeElement?.tagName
                }));
                add('Mobile menu opens accessibly', openState.open && openState.ariaHidden === 'false' && openState.ariaExpanded === 'true' && openState.bodyOverflow === 'hidden', openState);
                await page.screenshot({ path: 'qa-artifacts/mobile-menu-open.png', fullPage: false });

                await page.keyboard.press('Escape');
                await page.waitForTimeout(150);
                const closedState = await page.evaluate(() => ({
                  open: document.getElementById('mobileMenu')?.classList.contains('open'),
                  ariaHidden: document.getElementById('mobileMenu')?.getAttribute('aria-hidden'),
                  ariaExpanded: document.getElementById('hamburger')?.getAttribute('aria-expanded'),
                  bodyOverflow: document.body.style.overflow,
                  activeId: document.activeElement?.id || null
                }));
                add('Mobile menu closes with Escape and restores focus', !closedState.open && closedState.ariaHidden === 'true' && closedState.ariaExpanded === 'false' && closedState.bodyOverflow === '' && closedState.activeId === 'hamburger', closedState);

                await page.locator('#hamburger').click();
                const aboutLink = page.locator('.mobile-link[href="/about/"]');
                const aboutHref = await aboutLink.getAttribute('href');
                add('Mobile menu links to dedicated ABOUT page', aboutHref === '/about/', { aboutHref });
                await page.keyboard.press('Escape');
                await page.waitForTimeout(120);
                const afterAboutCheck = await page.evaluate(() => ({
                  menuOpen: document.getElementById('mobileMenu')?.classList.contains('open'),
                  bodyOverflow: document.body.style.overflow
                }));
                add('Mobile menu closes after ABOUT route check', !afterAboutCheck.menuOpen && afterAboutCheck.bodyOverflow === '', afterAboutCheck);
              }

              await page.locator('#faq').scrollIntoViewIfNeeded();
              await page.waitForTimeout(300);
              const faqButtons = page.locator('.faq-q');
              if (await faqButtons.count() >= 2) {
                await faqButtons.nth(1).click();
                await page.waitForTimeout(180);
                const faqState = await page.evaluate(() => {
                  const items = [...document.querySelectorAll('.faq-item')];
                  const second = items[1];
                  const first = items[0];
                  const a = second?.querySelector('.faq-a');
                  return {
                    firstExpanded: first?.querySelector('.faq-q')?.getAttribute('aria-expanded'),
                    secondExpanded: second?.querySelector('.faq-q')?.getAttribute('aria-expanded'),
                    secondOpen: second?.classList.contains('open'),
                    secondMaxHeight: a?.style.maxHeight || '',
                    secondHeight: a?.getBoundingClientRect().height || 0
                  };
                });
                add('FAQ accordion switches correctly', faqState.firstExpanded === 'false' && faqState.secondExpanded === 'true' && faqState.secondOpen && faqState.secondHeight > 0, faqState);
                await page.screenshot({ path: 'qa-artifacts/mobile-faq-open.png', fullPage: false });
              }

              const more = page.locator('.faq-more-toggle');
              if (await more.count()) {
                await more.click();
                await page.waitForTimeout(150);
                const moreState = await page.evaluate(() => ({
                  expanded: document.querySelector('.faq-more-toggle')?.getAttribute('aria-expanded'),
                  hiddenExtra: [...document.querySelectorAll('.faq-list > .faq-item')].slice(3).filter(x => x.hidden).length
                }));
                add('FAQ more toggle reveals extra questions', moreState.expanded === 'true' && moreState.hiddenExtra === 0, moreState);
              }

              await page.locator('#contact').scrollIntoViewIfNeeded();
              await page.waitForTimeout(250);
              await page.locator('#company').fill('LUEN QA');
              await page.locator('#name').fill('QA');
              await page.locator('#market').selectOption({ label: '일본 시장' });
              await page.locator('label[for="privacyConsent"]').click();
              await page.locator('label[for="overseasConsent"]').click();

              const submit = page.locator('#contactForm .form-submit');
              if (await submit.count()) {
                await submit.click();
                await page.waitForTimeout(120);
                const contactValidity = await page.evaluate(() => {
                  const email = document.getElementById('email');
                  return {
                    emailValid: email?.validity.valid,
                    emailMessage: email?.validationMessage || '',
                    activeId: document.activeElement?.id || null
                  };
                });
                add('Contact form requires email or phone', contactValidity.emailValid === false && contactValidity.activeId === 'email', contactValidity);

                await page.locator('#email').fill('qa@example.invalid');
                await page.route('https://formspree.io/**', async route => {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: '{"ok":true}' });
                });
                await submit.click();
                await page.waitForTimeout(350);
                const formState = await page.evaluate(() => ({
                  successClass: document.getElementById('contactForm')?.classList.contains('is-success'),
                  submitDisabled: document.querySelector('#contactForm .form-submit')?.disabled || false
                }));
                add('Contact form success UI works with mocked successful response', formState.successClass && !formState.submitDisabled, formState);
                await page.screenshot({ path: 'qa-artifacts/mobile-form-success.png', fullPage: false });
              }

              const heroCases = page.locator('.hero-cta a[href="#cases"]');
              if (await heroCases.count()) {
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForTimeout(250);
                await heroCases.click();
                await page.waitForTimeout(850);
                const heroAnchor = await page.evaluate(() => {
                  const nav = document.getElementById('nav')?.getBoundingClientRect();
                  const el = document.getElementById('cases')?.getBoundingClientRect();
                  return { hash: location.hash, navBottom: nav?.bottom ?? null, targetTop: el?.top ?? null };
                });
                add('Hero case CTA reaches cases', heroAnchor.hash === '#cases', heroAnchor);
                add('Cases anchor not materially hidden by nav', heroAnchor.targetTop === null || heroAnchor.navBottom === null || heroAnchor.targetTop >= heroAnchor.navBottom - 12, heroAnchor);
              }

              await context.close();
            }

            // DESKTOP 1440
            {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push('desktop: ' + msg.text()); });
              page.on('pageerror', err => report.pageErrors.push('desktop: ' + String(err)));

              await openPage(page);

              await page.evaluate(() => window.scrollTo(0, Math.max(900, innerHeight)));
              await page.waitForTimeout(250);
              const navState = await page.evaluate(() => {
                const nav = document.getElementById('nav');
                const r = nav?.getBoundingClientRect();
                const s = nav ? getComputedStyle(nav) : null;
                const floatCta = document.getElementById('floatCta');
                return {
                  scrolledClass: nav?.classList.contains('scrolled'),
                  position: s?.position || null,
                  top: r ? r.top : null,
                  bottom: r ? r.bottom : null,
                  floatCtaExists: Boolean(floatCta),
                  floatCtaShown: floatCta?.classList.contains('show') || false
                };
              });
              add('Desktop nav enters scrolled state', navState.scrolledClass, navState);
              add('Desktop nav remains pinned at viewport top', navState.position === 'fixed' || navState.position === 'sticky' || Math.abs(navState.top || 0) <= 2, navState);
              await page.screenshot({ path: 'qa-artifacts/desktop-scrolled.png', fullPage: false });

              const loop = page.locator('[data-loop-strip]').first();
              if (await loop.count()) {
                await loop.scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);
                const t1 = await loop.locator('.loop-track').evaluate(el => getComputedStyle(el).transform);
                await page.waitForTimeout(600);
                const t2 = await loop.locator('.loop-track').evaluate(el => getComputedStyle(el).transform);
                add('Loop strip is moving', t1 !== t2, { transformBefore: t1, transformAfter: t2 });
              }

              const voiceDots = page.locator('.voice-dots button');
              if (await voiceDots.count() >= 2) {
                await voiceDots.nth(1).click();
                await page.waitForTimeout(100);
                const voiceState = await page.evaluate(() => ({
                  activeDot: [...document.querySelectorAll('.voice-dots button')].findIndex(x => x.classList.contains('active')),
                  activeVoice: [...document.querySelectorAll('.voice-item')].findIndex(x => x.classList.contains('active'))
                }));
                add('Client Voice dot navigation works', voiceState.activeDot === 1 && voiceState.activeVoice === 1, voiceState);
              }

              await page.locator('#contact').scrollIntoViewIfNeeded();
              await page.waitForTimeout(350);
              const contactFloat = await page.evaluate(() => {
                const f = document.getElementById('floatCta');
                return { exists: Boolean(f), shown: f?.classList.contains('show') || false };
              });
              if (contactFloat.exists) add('Floating CTA hides at contact section', !contactFloat.shown, contactFloat);

              await context.close();
            }

            // MULTI-PAGE QA — new Phase 3 routes
            await auditSubpage(browser, 'services/', 'Services Hub', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                serviceRows: document.querySelectorAll('.service-hub-item').length,
                links: [...document.querySelectorAll('.service-hub-item a')].map(a => a.getAttribute('href'))
              }));
              const expected = [
                '/services/japan-marketing/',
                '/services/japan-creator-marketing/',
                '/services/japan-inbound/',
                '/services/youtube-creator-marketing/'
              ];
              add('Services Hub ' + viewport + ' has four service entries', state.serviceRows === 4, state);
              add('Services Hub ' + viewport + ' links all four service pages', expected.every(href => state.links.includes(href)), state);
            });

            await auditSubpage(browser, 'services/japan-creator-marketing/', 'Japan Creator Marketing', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                creatorFitExists: Boolean(document.getElementById('creator-fit')),
                creatorCards: document.querySelectorAll('.jcm-creator-card').length,
                schemaScripts: [...document.querySelectorAll('script[type="application/ld+json"]')].length,
                bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length
              }));
              add('Japan Creator Marketing ' + viewport + ' creator-fit section exists', state.creatorFitExists, state);
              add('Japan Creator Marketing ' + viewport + ' has four creator-fit cards', state.creatorCards === 4, state);
              add('Japan Creator Marketing ' + viewport + ' has structured data', state.schemaScripts >= 3, state);
              add('Japan Creator Marketing ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);

              await page.locator('#creator-fit').scrollIntoViewIfNeeded();
              await page.waitForTimeout(900);
              const creatorImages = await page.evaluate(() => {
                const images = [...document.querySelectorAll('.jcm-creator-card img')];
                return {
                  total: images.length,
                  loaded: images.filter(img => img.complete && img.naturalWidth > 0).length,
                  failed: images.filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src)
                };
              });
              add('Japan Creator Marketing ' + viewport + ' creator images load after scroll', creatorImages.total === 4 && creatorImages.loaded === 4 && creatorImages.failed.length === 0, creatorImages);
              await page.locator('#creator-fit').screenshot({ path: 'qa-artifacts/japan-creator-fit-' + viewport + '.png' });
            });

            const phase4Pages = [
              ['services/japan-marketing/', 'Japan Marketing'],
              ['services/japan-inbound/', 'Japan Inbound'],
              ['services/youtube-creator-marketing/', 'YouTube Creator Marketing']
            ];

            for (const [path, label] of phase4Pages) {
              await auditSubpage(browser, path, label, async (page, viewport) => {
                const state = await page.evaluate(() => ({
                  schemaScripts: [...document.querySelectorAll('script[type="application/ld+json"]')].length,
                  bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length,
                  canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                  serviceCurrent: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || ''
                }));
                add(label + ' ' + viewport + ' has structured data', state.schemaScripts >= 3, state);
                add(label + ' ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);
                add(label + ' ' + viewport + ' canonical matches route', state.canonical.endsWith('/' + path), state);
                add(label + ' ' + viewport + ' keeps Services nav active', state.serviceCurrent === '/services/', state);

                await page.evaluate(async () => {
                  const step = Math.max(500, Math.floor(innerHeight * 0.8));
                  for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                    scrollTo(0, y);
                    await new Promise(r => setTimeout(r, 60));
                  }
                  scrollTo(0, 0);
                });
                await page.waitForTimeout(500);
                const lazy = await page.evaluate(() => {
                  const images = [...document.images];
                  return {
                    total: images.length,
                    failed: images.filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src)
                  };
                });
                add(label + ' ' + viewport + ' images load after full scroll', lazy.failed.length === 0, lazy);

                const caseGrid = page.locator('.jcm-creator-grid').first();
                if (await caseGrid.count()) {
                  await caseGrid.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(900);
                  const painted = await page.evaluate(() => {
                    const images = [...document.querySelectorAll('.jcm-creator-grid img')];
                    return images.map(img => {
                      const cs = getComputedStyle(img);
                      const rect = img.getBoundingClientRect();
                      return {
                        src: img.currentSrc || img.src,
                        complete: img.complete,
                        naturalWidth: img.naturalWidth,
                        width: rect.width,
                        height: rect.height,
                        opacity: cs.opacity,
                        display: cs.display,
                        visibility: cs.visibility
                      };
                    });
                  });
                  const visibleImages = painted.filter(img =>
                    img.complete &&
                    img.naturalWidth > 0 &&
                    img.width > 40 &&
                    img.height > 40 &&
                    Number(img.opacity) > 0 &&
                    img.display !== 'none' &&
                    img.visibility !== 'hidden'
                  );
                  add(label + ' ' + viewport + ' case images are visibly painted', visibleImages.length === painted.length && painted.length > 0, { painted });
                  await caseGrid.screenshot({ path: 'qa-artifacts/' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-cases-' + viewport + '.png' });
                }
              });
            }

            // CASE STUDIES QA — Phase 5
            await auditSubpage(browser, 'cases/', 'Case Studies Hub', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                cards: document.querySelectorAll('.case-hub-card').length,
                links: [...document.querySelectorAll('.case-hub-card')].map(a => a.getAttribute('href')),
                schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || ''
              }));
              const expected = [
                '/cases/herahera-seoul-fnb/',
                '/cases/ikeda-edita/',
                '/cases/yuki-clinic/',
                '/cases/masubuchi-bibigo/'
              ];
              add('Case Studies Hub ' + viewport + ' has four cases', state.cards === 4, state);
              add('Case Studies Hub ' + viewport + ' links all four detail pages', expected.every(href => state.links.includes(href)), state);
              add('Case Studies Hub ' + viewport + ' structured data present', state.schemaScripts >= 2, state);
              add('Case Studies Hub ' + viewport + ' keeps Case Studies nav active', state.currentNav === '/cases/', state);

              const grid = page.locator('.case-hub-grid');
              if (await grid.count()) {
                await grid.scrollIntoViewIfNeeded();
                await page.waitForTimeout(900);
                const imgs = await page.evaluate(() => [...document.querySelectorAll('.case-hub-card img')].map(img => ({
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  opacity: getComputedStyle(img).opacity,
                  width: img.getBoundingClientRect().width,
                  height: img.getBoundingClientRect().height
                })));
                add('Case Studies Hub ' + viewport + ' case images visibly load', imgs.length === 4 && imgs.every(i => i.complete && i.naturalWidth > 0 && Number(i.opacity) > 0 && i.width > 40 && i.height > 40), { imgs });
                await grid.screenshot({ path: 'qa-artifacts/case-studies-hub-grid-' + viewport + '.png' });
              }
            });

            const casePages = [
              ['cases/herahera-seoul-fnb/', 'Herahera Case'],
              ['cases/ikeda-edita/', 'Ikeda EDITA Case'],
              ['cases/yuki-clinic/', 'YUKI Clinic Case'],
              ['cases/masubuchi-bibigo/', 'Masubuchi bibigo Case']
            ];

            for (const [path, label] of casePages) {
              await auditSubpage(browser, path, label, async (page, viewport) => {
                const state = await page.evaluate(() => ({
                  flowSteps: document.querySelectorAll('.jcm-flow > li').length,
                  metrics: document.querySelectorAll('.luen-proof-metric').length,
                  schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                  bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length,
                  canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                  currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || '',
                  relatedLinks: document.querySelectorAll('.case-study-next a').length
                }));
                add(label + ' ' + viewport + ' has six-step action flow', state.flowSteps === 6, state);
                add(label + ' ' + viewport + ' has three result metrics', state.metrics === 3, state);
                add(label + ' ' + viewport + ' structured data present', state.schemaScripts >= 2, state);
                add(label + ' ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);
                add(label + ' ' + viewport + ' canonical matches route', state.canonical.endsWith('/' + path), state);
                add(label + ' ' + viewport + ' keeps Case Studies nav active', state.currentNav === '/cases/', state);
                add(label + ' ' + viewport + ' has related navigation', state.relatedLinks === 2, state);

                const visual = page.locator('.case-study-visual').first();
                if (await visual.count()) {
                  await visual.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(700);
                  const imageState = await visual.locator('img').evaluate(img => ({
                    complete: img.complete,
                    naturalWidth: img.naturalWidth,
                    opacity: getComputedStyle(img).opacity,
                    width: img.getBoundingClientRect().width,
                    height: img.getBoundingClientRect().height
                  }));
                  add(label + ' ' + viewport + ' hero case image visibly loads', imageState.complete && imageState.naturalWidth > 0 && Number(imageState.opacity) > 0 && imageState.width > 100 && imageState.height > 80, imageState);
                  await visual.screenshot({ path: 'qa-artifacts/' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-visual-' + viewport + '.png' });
                }
              });
            }

            // PROJECT GUIDE QA — Phase 6
            await auditSubpage(browser, 'project-guide/', 'Project Guide', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                processSteps: document.querySelectorAll('.jcm-process > article').length,
                deliverables: document.querySelectorAll('.project-guide-deliverable').length,
                timelineSteps: document.querySelectorAll('.project-guide-timeline > article').length,
                budgetCards: document.querySelectorAll('.project-guide-budget > article').length,
                factors: document.querySelectorAll('.project-guide-factor').length,
                faqItems: document.querySelectorAll('.luen-page-faq details').length,
                schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length,
                canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || ''
              }));
              add('Project Guide ' + viewport + ' has six campaign process steps', state.processSteps === 6, state);
              add('Project Guide ' + viewport + ' has six deliverables', state.deliverables === 6, state);
              add('Project Guide ' + viewport + ' has five timeline steps', state.timelineSteps === 5, state);
              add('Project Guide ' + viewport + ' has four budget structures', state.budgetCards === 4, state);
              add('Project Guide ' + viewport + ' has eight cost factors', state.factors === 8, state);
              add('Project Guide ' + viewport + ' has five FAQ items', state.faqItems === 5, state);
              add('Project Guide ' + viewport + ' structured data present', state.schemaScripts >= 3, state);
              add('Project Guide ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);
              add('Project Guide ' + viewport + ' canonical matches route', state.canonical.endsWith('/project-guide/'), state);
              add('Project Guide ' + viewport + ' keeps Process nav active', state.currentNav === '/project-guide/', state);

              const docs = page.locator('.project-guide-docs');
              if (await docs.count()) {
                await docs.scrollIntoViewIfNeeded();
                await page.waitForTimeout(900);
                const imageState = await page.evaluate(() => [...document.querySelectorAll('.project-guide-doc img')].map(img => ({
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  width: img.getBoundingClientRect().width,
                  height: img.getBoundingClientRect().height,
                  opacity: getComputedStyle(img).opacity
                })));
                add('Project Guide ' + viewport + ' proposal images visibly load', imageState.length === 2 && imageState.every(img => img.complete && img.naturalWidth > 0 && img.width > 100 && img.height > 100 && Number(img.opacity) > 0), { imageState });
                await docs.screenshot({ path: 'qa-artifacts/project-guide-docs-' + viewport + '.png' });
              }
            });

            // ABOUT + CONTACT QA — Phase 7
            await auditSubpage(browser, 'about/', 'About Page', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                bridgeNodes: document.querySelectorAll('.about-bridge-node').length,
                principles: document.querySelectorAll('.about-principle').length,
                platforms: document.querySelectorAll('.about-platform').length,
                operations: document.querySelectorAll('.about-operating-grid > article').length,
                schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || '',
                bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length
              }));
              add('About Page ' + viewport + ' has three cross-border nodes', state.bridgeNodes === 3, state);
              add('About Page ' + viewport + ' has four operating principles', state.principles === 4, state);
              add('About Page ' + viewport + ' has five platform roles', state.platforms === 5, state);
              add('About Page ' + viewport + ' has six operation items', state.operations === 6, state);
              add('About Page ' + viewport + ' structured data present', state.schemaScripts >= 2, state);
              add('About Page ' + viewport + ' canonical matches route', state.canonical.endsWith('/about/'), state);
              add('About Page ' + viewport + ' keeps About nav active', state.currentNav === '/about/', state);
              add('About Page ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);

              if (viewport === 'desktop') {
                const bridgeLayout = await page.evaluate(() => {
                  const nodes = [...document.querySelectorAll('.about-bridge-node')].map(el => {
                    const r = el.getBoundingClientRect();
                    return { left: r.left, top: r.top, width: r.width, height: r.height };
                  });
                  return { nodes };
                });
                const centers = bridgeLayout.nodes.map(n => n.top + n.height / 2);
                const sameRow = bridgeLayout.nodes.length === 3 &&
                  Math.max(...centers) - Math.min(...centers) <= 4 &&
                  bridgeLayout.nodes[0].left < bridgeLayout.nodes[1].left &&
                  bridgeLayout.nodes[1].left < bridgeLayout.nodes[2].left;
                add('About Page desktop cross-border bridge stays on one row', sameRow, bridgeLayout);
              }

              const bridge = page.locator('.about-bridge');
              if (await bridge.count()) {
                await bridge.scrollIntoViewIfNeeded();
                await page.waitForTimeout(450);
                await bridge.screenshot({ path: 'qa-artifacts/about-bridge-' + viewport + '.png' });
              }
            });

            await auditSubpage(browser, 'contact/', 'Contact Page', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                formExists: Boolean(document.getElementById('contactForm')),
                source: document.querySelector('#contactForm input[name="source"]')?.value || '',
                privacyRequired: Boolean(document.getElementById('privacyConsent')?.required),
                overseasRequired: Boolean(document.getElementById('overseasConsent')?.required),
                schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                contactCurrent: document.querySelector('.nav-contact[aria-current="page"]')?.getAttribute('href') || '',
                bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length
              }));
              add('Contact Page ' + viewport + ' form exists', state.formExists, state);
              add('Contact Page ' + viewport + ' uses dedicated source label', state.source === 'LUEN Contact Page', state);
              add('Contact Page ' + viewport + ' keeps required consent fields', state.privacyRequired && state.overseasRequired, state);
              add('Contact Page ' + viewport + ' structured data present', state.schemaScripts >= 2, state);
              add('Contact Page ' + viewport + ' canonical matches route', state.canonical.endsWith('/contact/'), state);
              add('Contact Page ' + viewport + ' keeps Contact nav active', state.contactCurrent === '/contact/', state);
              add('Contact Page ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);

              if (viewport === 'mobile') {
                await page.locator('#company').fill('LUEN QA');
                await page.locator('#name').fill('QA');
                await page.locator('#market').selectOption({ label: '일본 시장' });
                await page.locator('label[for="privacyConsent"]').click();
                await page.locator('label[for="overseasConsent"]').click();

                const submit = page.locator('#contactForm .form-submit');
                await submit.click();
                await page.waitForTimeout(120);
                const requiredState = await page.evaluate(() => {
                  const email = document.getElementById('email');
                  return {
                    emailValid: email?.validity.valid,
                    activeId: document.activeElement?.id || null,
                    emailMessage: email?.validationMessage || ''
                  };
                });
                add('Contact Page mobile requires email or phone', requiredState.emailValid === false && requiredState.activeId === 'email', requiredState);

                await page.locator('#email').fill('qa@example.invalid');
                await page.route('https://formspree.io/**', async route => {
                  await route.fulfill({ status: 200, contentType: 'application/json', body: '{"ok":true}' });
                });
                await submit.click();
                await page.waitForTimeout(350);
                const success = await page.evaluate(() => ({
                  successClass: document.getElementById('contactForm')?.classList.contains('is-success'),
                  successVisible: document.getElementById('formSuccess')?.getBoundingClientRect().height > 0,
                  submitDisabled: document.querySelector('#contactForm .form-submit')?.disabled || false
                }));
                add('Contact Page mobile mocked submission shows success UI', success.successClass && success.successVisible && !success.submitDisabled, success);
                await page.locator('.contact-page-form').screenshot({ path: 'qa-artifacts/contact-form-success-mobile.png' });
              }
            });

            // INSIGHTS QA — Phase 8
            await auditSubpage(browser, 'insights/', 'Insights Hub', async (page, viewport) => {
              const state = await page.evaluate(() => ({
                cards: document.querySelectorAll('.insight-card').length,
                schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || '',
                oldWorkNav: [...document.querySelectorAll('.nav-links a')].some(a => a.textContent.trim() === 'WORK'),
                oldProcessNav: [...document.querySelectorAll('.nav-links a')].some(a => a.textContent.trim() === 'PROCESS'),
                projectGuideLabel: [...document.querySelectorAll('.nav-links a')].some(a => a.textContent.trim() === 'PROJECT GUIDE')
              }));
              add('Insights Hub ' + viewport + ' has five insight cards', state.cards === 5, state);
              add('Insights Hub ' + viewport + ' structured data present', state.schemaScripts >= 2, state);
              add('Insights Hub ' + viewport + ' canonical matches route', state.canonical.endsWith('/insights/'), state);
              add('Insights Hub ' + viewport + ' keeps Insights nav active', state.currentNav === '/insights/', state);
              add('Insights Hub ' + viewport + ' uses new primary navigation', !state.oldWorkNav && !state.oldProcessNav && state.projectGuideLabel, state);
            });

            const insightPages = [
              ['insights/japan-influencer-marketing-cost/', 'Insight Cost'],
              ['insights/japan-youtuber-matching-guide/', 'Insight YouTuber Matching'],
              ['insights/how-to-choose-japan-marketing-agency/', 'Insight Agency Guide'],
              ['insights/youtube-creator-marketing-metrics/', 'Insight YouTube Metrics'],
              ['insights/japan-inbound-creator-marketing/', 'Insight Japan Inbound']
            ];

            for (const [path, label] of insightPages) {
              await auditSubpage(browser, path, label, async (page, viewport) => {
                const state = await page.evaluate(() => {
                  const sections = [...document.querySelectorAll('.insight-section')];
                  const tocLinks = [...document.querySelectorAll('.insight-toc a')];
                  const ids = [...document.querySelectorAll('[id]')].map(el => el.id);
                  const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
                  const sourceLinks = [...document.querySelectorAll('.insight-sources a[href^="http"]')];
                  return {
                    sections: sections.length,
                    tocLinks: tocLinks.length,
                    tocTargetsValid: tocLinks.every(a => {
                      const href = a.getAttribute('href') || '';
                      return href.startsWith('#') && Boolean(document.querySelector(href));
                    }),
                    relatedLinks: document.querySelectorAll('.insight-related a').length,
                    schemaScripts: document.querySelectorAll('script[type="application/ld+json"]').length,
                    canonical: document.querySelector('link[rel="canonical"]')?.href || '',
                    currentNav: document.querySelector('.nav-links a[aria-current="page"]')?.getAttribute('href') || '',
                    sourceLinks: sourceLinks.length,
                    duplicateIds: [...new Set(duplicates)],
                    bannedTermCount: (document.body.innerText.match(/크리에이터 섭외/g) || []).length
                  };
                });
                add(label + ' ' + viewport + ' has substantial article sections', state.sections >= 5, state);
                add(label + ' ' + viewport + ' TOC matches article sections', state.tocLinks === state.sections && state.tocTargetsValid, state);
                add(label + ' ' + viewport + ' has three related links', state.relatedLinks === 3, state);
                add(label + ' ' + viewport + ' structured data present', state.schemaScripts >= 3, state);
                add(label + ' ' + viewport + ' canonical matches route', state.canonical.endsWith('/' + path), state);
                add(label + ' ' + viewport + ' keeps Insights nav active', state.currentNav === '/insights/', state);
                add(label + ' ' + viewport + ' includes source references', state.sourceLinks >= 2, state);
                add(label + ' ' + viewport + ' has no duplicate IDs', state.duplicateIds.length === 0, state);
                add(label + ' ' + viewport + ' uses creator matching terminology', state.bannedTermCount === 0, state);

                if (viewport === 'mobile') {
                  const firstToc = page.locator('.insight-toc a').first();
                  if (await firstToc.count()) {
                    await firstToc.click();
                    await page.waitForTimeout(180);
                    const targetState = await page.evaluate(() => ({
                      hash: location.hash,
                      targetExists: Boolean(location.hash && document.querySelector(location.hash))
                    }));
                    add(label + ' mobile TOC navigation works', Boolean(targetState.hash) && targetState.targetExists, targetState);
                  }
                }
              });
            }

            add('No uncaught page errors', report.pageErrors.length === 0, { errors: report.pageErrors });
            add('No console errors', report.consoleErrors.length === 0, { errors: report.consoleErrors });

            report.pass = report.tests.every(t => t.pass);
            fs.writeFileSync('qa-artifacts/interaction-report.json', JSON.stringify(report, null, 2));

            let md = '# LUEN Interaction QA\n\n';
            md += 'Target: ' + target + '\n\n';
            for (const t of report.tests) md += '- ' + (t.pass ? 'PASS' : 'FAIL') + ' — ' + t.name + '\n';
            md += '\nOverall: ' + (report.pass ? 'PASS' : 'FAIL') + '\n';
            fs.writeFileSync('qa-artifacts/interaction-summary.md', md);

            await browser.close();
            if (!report.pass) process.exitCode = 2;
          })().catch(err => {
            fs.writeFileSync('qa-artifacts/fatal.txt', String(err.stack || err));
            console.error(err);
            process.exit(1);
          });
          NODE
          node ./interaction-qa.cjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luen-interaction-qa
          path: qa-artifacts/
          retention-days: 7
