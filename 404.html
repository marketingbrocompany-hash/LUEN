<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,follow"/>
<title>페이지를 찾을 수 없습니다 | LUEN</title>
<meta name="description" content="요청하신 페이지를 찾을 수 없습니다."/>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml"/>
<meta name="theme-color" content="#F5F3EE"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet"/>
<style>
:root{--bg:#F5F3EE;--surface:#FFFFFF;--line:#DCD8D0;--ink:#11100E;--text:#171614;--muted:#77736C;--muted-2:#9B968D;--orange:#D96532;--orange-2:#E98250}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Pretendard","Inter",sans-serif}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.top{padding:30px 0 24px;border-bottom:1px solid var(--line)}
.wrap{width:min(720px,calc(100% - 48px));margin:0 auto}
.top a{text-decoration:none;font:800 22px/1 Inter,sans-serif;letter-spacing:.18em;color:var(--ink);transition:opacity .2s ease}
.top a:hover{opacity:.64}
.top span{display:block;margin-top:10px;color:var(--muted-2);font:600 10px/1.4 Inter,sans-serif;letter-spacing:.14em}
main{flex:1;display:flex;align-items:center}
.hero{padding:80px 0}
.hero small{color:var(--orange);font:700 10px/1 Inter,sans-serif;letter-spacing:.18em}
.hero h1{margin:18px 0 14px;color:var(--ink);font-size:clamp(34px,5vw,52px);line-height:1.15;letter-spacing:-.04em;word-break:keep-all}
.hero p{margin:0;max-width:520px;color:var(--muted);font-size:15px;line-height:1.85;word-break:keep-all}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:750;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.btn-primary{border:1px solid var(--orange);background:var(--orange);color:#17120F}
.btn-primary:hover{transform:translateY(-2px);background:var(--orange-2);border-color:var(--orange-2)}
.btn-secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn-secondary:hover{transform:translateY(-2px);border-color:var(--orange)}
.footer{padding:34px 0 42px;border-top:1px solid rgba(245,243,238,.08);background:#11100E;color:#9B968D;font-size:12px;line-height:1.75}
.footer .wrap{width:min(720px,calc(100% - 48px))}
@media(max-width:640px){.wrap,.footer .wrap{width:min(100% - 28px,720px)}.top{padding:24px 0 20px}.hero{padding:56px 0}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/">LUEN</a><span>KOREA × JAPAN CREATOR MARKETING</span></div></header>
<main><div class="wrap hero">
<small>404 ERROR</small>
<h1>요청하신 페이지를<br/>찾을 수 없습니다.</h1>
<p>주소가 변경되었거나 삭제된 페이지일 수 있습니다. 아래에서 홈페이지로 돌아가거나 프로젝트 문의를 남겨주세요.</p>
<div class="actions">
<a class="btn btn-primary" href="/">홈으로 돌아가기 →</a>
<a class="btn btn-secondary" href="/#contact">프로젝트 문의하기</a>
</div>
</div></main>
<footer class="footer"><div class="wrap">루엔 · 대표 이호규 · 사업자등록번호 412-43-01039 · 서울특별시 마포구 동교로17안길 10, 3층(서교동)<br/>© 2026 LUEN. All rights reserved.</div></footer>
</body>
</html>
